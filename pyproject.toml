[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delta"
version = "0.4.0.dev0"
description = "Agent delta platform — provider-agnostic agentic delta runtime"
requires-python = ">=3.11"
dependencies = [
    "openai==3.8.0",
    "anthropic==1.3.0",  # native Claude Messages API provider
    "textual==8.2.8",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    # Pinned to a known aisuite commit; update only as a deliberate dependency change.
    "aisuite @ git+https://github.com/andrewyng/aisuite.git@1b4bbf303ec21968230b1ec869a144d054e9b3c4",
    "docstring_parser==0.18.0",
    "pyyaml==6.0.3",  # persona manifest frontmatter (YAML)
    "pydantic==2.13.4",
    "mcp==2.1.1",  # MCP client (stdio + streamable-http); 2.x renames streamablehttp_client and moves headers/auth onto a caller-owned httpx2 client
    "httpx==0.28.1",  # sync outbound senders for messaging connectors (send_message tool)
    "websockets==16.1.1",  # WS client (used by integrations/managed Capability Port tests)
    "ddgs==9.16.0",  # keyless default web-search provider (DuckDuckGo); Tavily/Brave use httpx
    "croniter==6.2.4",  # cron next-fire math for the automation scheduler
    # PDF fallback: pypdf extracts text; pypdfium2 rasterizes scanned pages without AGPL PyMuPDF.
    "pypdf==6.16.2",
    "pypdfium2==5.13.0",
    # Windows needs IANA timezone data for named schedules.
    "tzdata==2026.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    # CI tools stay in the project lockfile for reproducible static/audit gates.
    "pip-audit==2.10.1",
    "pyright==1.1.411",
    "ruff==0.16.6",
]
# Inbound messaging listeners; outbound messaging already uses core httpx.
messaging = ["python-telegram-bot==22.8", "slack-bolt==1.30.0", "aiohttp==3.14.3"]
# Interactive Delta browser automation.
browser = ["playwright>=1.62.0"]
# Windows Portable build dependency.
build = ["pyinstaller==6.22.2"]

[project.scripts]
delta = "core.cli:main"
delta-server = "services.server.run:main"
delta-connectors = "integrations.connectors.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "integrations*", "packages*", "providers*", "services*"]

[tool.setuptools.package-data]
core = ["personas/builtin/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
# Keep the lint surface explicit; expand rule families only in dedicated policy changes.
select = ["E4", "E7", "E9", "F"]

[tool.uv]
# Pin the CI/release resolver for reproducibility across supported platforms.
required-version = "==0.12.3"
