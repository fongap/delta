[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delta"
version = "0.2.2"
description = "Agent delta platform — provider-agnostic agentic delta runtime"
requires-python = ">=3.11"
dependencies = [
    "openai==3.2.0",
    "anthropic==0.122.0",  # native Claude Messages API provider
    "google-genai==2.18.1",  # native Gemini provider
    "google-auth==2.56.3",  # Vertex credentials (service account / ADC / MaaS bearer)
    "textual==8.2.8",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    # Keep the immutable OpenWorker import commit: it contains Agent/runtime fixes newer
    # than the 2025-11 PyPI 0.1.14 artifact, so equal package metadata is not equivalence.
    "aisuite @ git+https://github.com/andrewyng/aisuite.git@1b4bbf303ec21968230b1ec869a144d054e9b3c4",
    "docstring_parser==0.18.0",
    "pyyaml==6.0.3",  # persona manifest frontmatter (YAML)
    "pydantic==2.13.4",
    "mcp==1.29.0",  # MCP client (stdio + streamable-http); 2.0 removed streamablehttp_client
    "httpx==0.28.1",  # sync outbound senders for messaging connectors (send_message tool)
    "websockets==16.1.1",  # managed Slack relay client transport (relay_client.py)
    "ddgs==9.15.0",  # keyless default web-search provider (DuckDuckGo); Tavily/Brave use httpx
    "croniter==6.2.4",  # cron next-fire math for the automation scheduler
    # PDF attachments for models without native PDF support (pdf_support.py):
    # pypdf = pure-python text extraction; pypdfium2 = page rasterization (BSD pdfium,
    # ships its own libpdfium — NOT PyMuPDF, whose AGPL license can't ride in a release package).
    "pypdf==6.16.1",
    "pypdfium2==5.13.0",
    # IANA tz database for zoneinfo. Windows ships no system tz db, so without this every
    # named schedule timezone (UTC, Asia/Kolkata, …) silently falls back to local time.
    "tzdata==2026.3; sys_platform == 'win32'",
    # tomllib landed in the 3.11 stdlib; on the 3.10 floor config.py falls back to tomli.
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1"]
# Inbound messaging listeners (outbound send_message needs only httpx, already a core dep).
# aiohttp is slack-bolt's Socket Mode transport at runtime (and the FakeSlack test harness
# drives the real handler) — declare it so CI installs it, not just transitively.
messaging = ["python-telegram-bot==22.8", "slack-bolt==1.30.0", "aiohttp==3.14.3"]
# Interactive Cowork browser automation.
browser = ["playwright>=1.62.0"]
# AWS Bedrock provider (lazy-imported; desktop builds bundle it, pip users opt in).
bedrock = ["boto3==1.43.81"]

[project.scripts]
delta = "core.cli:main"
delta-server = "services.server.run:main"
delta-connectors = "integrations.connectors.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "integrations*", "packages*", "providers*", "services*"]

[tool.setuptools.package-data]
core = ["personas/builtin/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
