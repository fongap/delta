[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delta"
version = "0.4.0.dev0"
description = "Delta controlled capability workers"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",  # sync outbound senders for messaging connectors (send_message tool)
    "ddgs==9.16.0",  # keyless default web-search provider (DuckDuckGo); Tavily/Brave use httpx
    # PDF fallback: pypdf extracts text; pypdfium2 rasterizes scanned pages without AGPL PyMuPDF.
    "pypdf==6.18.1",
    "pypdfium2==5.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    # CI tools stay in the project lockfile for reproducible static/audit gates.
    "pip-audit==2.10.1",
    "pyright==1.1.414",
    "ruff==0.16.7",
]
# Inbound messaging listeners; outbound messaging already uses core httpx.
messaging = ["python-telegram-bot==22.8", "slack-bolt==1.30.0", "aiohttp==3.14.3"]
# Interactive Delta browser automation.
browser = ["playwright>=1.62.0"]
[project.scripts]
delta-connectors = "integrations.connectors.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "integrations*", "packages*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
# Keep the lint surface explicit; expand rule families only in dedicated policy changes.
select = ["E4", "E7", "E9", "F"]

[tool.uv]
# Pin the CI/release resolver for reproducibility across supported platforms.
required-version = "==0.12.3"
