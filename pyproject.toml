[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delta"
version = "0.3.0"
description = "Agent delta platform — provider-agnostic agentic delta runtime"
requires-python = ">=3.11"
dependencies = [
    "openai==3.5.0",
    "anthropic==1.2.0",  # native Claude Messages API provider
    "textual==8.2.8",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    # Keep the immutable OpenWorker import commit: it contains Agent/runtime fixes newer
    # than the 2025-11 PyPI 0.1.14 artifact, so equal package metadata is not equivalence.
    "aisuite @ git+https://github.com/andrewyng/aisuite.git@1b4bbf303ec21968230b1ec869a144d054e9b3c4",
    "docstring_parser==0.18.0",
    "pyyaml==6.0.3",  # persona manifest frontmatter (YAML)
    "pydantic==2.13.4",
    "mcp==2.1.1",  # MCP client (stdio + streamable-http); 2.x renames streamablehttp_client and moves headers/auth onto a caller-owned httpx2 client
    "httpx==0.28.1",  # sync outbound senders for messaging connectors (send_message tool)
    "websockets==16.1.1",  # managed Slack relay client transport (relay_client.py)
    "ddgs==9.16.0",  # keyless default web-search provider (DuckDuckGo); Tavily/Brave use httpx
    "croniter==6.2.4",  # cron next-fire math for the automation scheduler
    # PDF attachments for models without native PDF support (pdf_support.py):
    # pypdf = pure-python text extraction; pypdfium2 = page rasterization (BSD pdfium,
    # ships its own libpdfium — NOT PyMuPDF, whose AGPL license can't ride in a release package).
    "pypdf==6.16.2",
    "pypdfium2==5.13.0",
    # IANA tz database for zoneinfo. Windows ships no system tz db, so without this every
    # named schedule timezone (UTC, Asia/Kolkata, …) silently falls back to local time.
    "tzdata==2026.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    # CI tools are project dependencies so uv.lock fixes the exact versions used
    # by all static/audit gates instead of resolving them separately at runtime.
    "pip-audit==2.10.1",
    "pyright==1.1.411",
    "ruff==0.16.5",
]
# Inbound messaging listeners (outbound send_message needs only httpx, already a core dep).
# aiohttp is slack-bolt's Socket Mode transport at runtime (and the FakeSlack test harness
# drives the real handler) — declare it so CI installs it, not just transitively.
messaging = ["python-telegram-bot==22.8", "slack-bolt==1.30.0", "aiohttp==3.14.3"]
# Interactive Cowork browser automation.
browser = ["playwright>=1.62.0"]
# Windows Portable build-only dependency. Keeping it as an explicit extra lets
# the release sidecar environment be reproduced from uv.lock.
build = ["pyinstaller==6.22.2"]

[project.scripts]
delta = "core.cli:main"
delta-server = "services.server.run:main"
delta-connectors = "integrations.connectors.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "integrations*", "packages*", "providers*", "services*"]

[tool.setuptools.package-data]
core = ["personas/builtin/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
# Pin the rule set to the same surface used by ruff ≤0.11 (E4/E7/E9/F).
# Ruff 0.12+ expanded the default selection to include BLE, S, B, UP, PLR, PLW,
# RUF, SIM, DTZ, FURB, C4, ISC, PERF, PIE, PYI, etc.  Enabling those broadly
# in a Dependabot version-bump PR would conflate a tool upgrade with a policy
# change.  Enable new rule families deliberately in a dedicated PR after
# reviewing findings and deciding which are project-appropriate.
select = ["E4", "E7", "E9", "F"]

[tool.uv]
# CI and release use this exact resolver so the committed uv.lock remains the
# single reproducible Python dependency graph across supported platforms.
required-version = "==0.12.3"
