[package]
name = "delta-runtime-native"
version = "0.1.0"
description = "Delta Core Rust runtime — state foundation (R1 shadow-read)"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "delta_runtime_native"
crate-type = ["rlib"]

[[bin]]
name = "verify_ledger"
path = "src/bin/verify_ledger.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
