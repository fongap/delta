[package]
name = "delta-runtime-native"
version = "0.1.0"
description = "Delta Core Rust runtime — state foundation (R1 shadow-read)"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "delta_runtime_native"
crate-type = ["rlib"]

[[bin]]
name = "verify_ledger"
path = "src/bin/verify_ledger.rs"

[[bin]]
name = "dump_idemlog"
path = "src/bin/dump_idemlog.rs"

[[bin]]
name = "write_idemlog"
path = "src/bin/write_idemlog.rs"

[[bin]]
name = "write_ledger"
path = "src/bin/write_ledger.rs"

[[bin]]
name = "write_tasks"
path = "src/bin/write_tasks.rs"

[[bin]]
name = "inspect_tasks"
path = "src/bin/inspect_tasks.rs"

[[bin]]
name = "inspect_artifact"
path = "src/bin/inspect_artifact.rs"

[[bin]]
name = "inspect_checkpoint"
path = "src/bin/inspect_checkpoint.rs"

[[bin]]
name = "inspect_citation"
path = "src/bin/inspect_citation.rs"

[[bin]]
name = "inspect_validation"
path = "src/bin/inspect_validation.rs"

[[bin]]
name = "delta_core"
path = "src/bin/delta_core.rs"

[dependencies]
csv = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
