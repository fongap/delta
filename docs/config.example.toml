# delta config — copy to one of:
#   ~/.config/delta/config.toml          (global)
#   <your-project>/.delta/config.toml    (per-workspace, overrides global)
#
# All keys are optional; unset keys fall back to built-in defaults.

model = "gpt-5.5"            # default model id (override per session in the UI/CLI)
mode = "interactive"         # plan | interactive | auto | custom
max_iterations = 12          # max model<->tool iterations per turn before stopping

# Commands auto-allowed without an approval prompt (prefix match).
#
# Ship an EMPTY allow-list by example. Any interpreter or package runner
# (python3, node, npm, pytest, …) can execute arbitrary code via -c, scripts,
# or installed binaries, so prefix-allowing one is equivalent to auto-approving
# arbitrary code execution. Add an entry only once you understand the risk and
# want that specific prefix to stop asking. The built-in code default is empty.
allowed_commands = []

# In "custom" permission mode, these tools are auto-approved (everything else still
# asks). e.g. auto-accept file edits but keep asking before running shell commands.
auto_allow = ["write_file", "replace_in_file", "apply_patch", "apply_unified_diff"]

# Server (delta-server) bind address.
host = "127.0.0.1"
port = 8765
