# Dependabot configuration for the Delta monorepo.
#
# Principles:
# - Only ecosystems and directories that actually exist in the repository are tracked.
# - Related updates are grouped to reduce PR noise.
# - Weekly updates run at a predictable time.
# - Open PR counts are deliberately bounded so dependency maintenance cannot flood
#   the repository or monopolize CI capacity.

version: 2

updates:
  # GitHub Actions — keep SHA-pinned workflow dependencies current as one group.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Shanghai"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # Desktop GUI (npm) — production and development dependencies are grouped separately.
  - package-ecosystem: "npm"
    directory: "/apps/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:10"
      timezone: "Asia/Shanghai"
    groups:
      npm-production:
        dependency-type: "production"
      npm-development:
        dependency-type: "development"
    open-pull-requests-limit: 5

  # Python runtime (pip) — production and development dependencies are grouped separately.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:20"
      timezone: "Asia/Shanghai"
    groups:
      pip-production:
        dependency-type: "production"
      pip-development:
        dependency-type: "development"
    open-pull-requests-limit: 5

  # Desktop Tauri application.
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5

  # Windows portable root launcher.
  - package-ecosystem: "cargo"
    directory: "/packaging/portable/launcher"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:40"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
