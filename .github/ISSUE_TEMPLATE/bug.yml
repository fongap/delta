name: Bug report
description: 报告可复现的产品缺陷
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请只在这里提交可复现的产品缺陷；使用问题请前往 Discussions / Q&A，功能建议请前往 Discussions / Ideas。

  - type: input
    id: version
    attributes:
      label: Delta version
      description: 请输入正在使用的 Delta 版本，例如 v0.3.1。
      placeholder: v0.3.1
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation
      description: 请选择安装方式。
      options:
        - Windows Portable
        - Development build
        - Other
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: 请输入 Windows 版本，例如 Windows 11 24H2。
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: 请简要说明实际发生了什么。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: 请提供最小、稳定的复现步骤。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: 说明你预期的正确行为。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: 可附上必要日志或截图。提交前请删除 Token、Secret、个人数据和其他敏感信息。

  - type: dropdown
    id: regression
    attributes:
      label: Regression?
      description: 这个问题是否在旧版本中正常、升级后才出现？
      options:
        - "No"
        - "Yes"
        - Unknown
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: 我已搜索现有 Issues，确认没有明显重复的问题。
          required: true
        - label: 我已从日志、截图和描述中删除 Token、Secret、个人数据及其他敏感信息。
          required: true
