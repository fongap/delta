title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎来到 Delta Discussions。

        这里用于安装、配置、模型接入、使用和排障问题。若已经确认是可复现的产品缺陷，请改到 Issues 提交；安全漏洞请勿公开披露。

  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 请说明你想解决的问题，以及当前看到的现象。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Delta 版本
      description: 如与具体版本有关，请填写，例如 v0.3.1。
      placeholder: v0.3.1

  - type: textarea
    id: tried
    attributes:
      label: 已尝试的方法
      description: 可选。说明已经尝试过的操作、结果或相关日志。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Discussions 和 Issues，确认没有明显重复的问题。
          required: true
        - label: 我没有提交 Token、Secret、个人数据或其他敏感信息。
          required: true
