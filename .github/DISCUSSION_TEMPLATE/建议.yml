title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出关于 Delta 的功能、交互、工作流和产品改进建议。

        这里用于还需要讨论、确认价值或明确实现边界的想法；当方向成熟并确认实施后，再转为 Issue 跟踪执行。

  - type: textarea
    id: idea
    attributes:
      label: 你的建议
      description: 请说明希望增加、调整或移除什么。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 说明当前遇到的实际问题、限制或使用场景。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的体验
      description: 描述你认为更合适的交互、流程或结果。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有讨论和 Issues，确认没有明显重复的建议。
          required: true
        - label: 这不是一个已确认可复现的缺陷；如果是，我会改到 Issues 提交。
          required: true
