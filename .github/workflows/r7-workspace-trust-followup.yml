name: R7 Workspace Trust Followup

on:
  push:
    branches:
      - codex/r7-workspace-trust-failclosed

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/r7-workspace-trust-failclosed
      - name: Apply refinement
        run: |
          set -euo pipefail
          python3 scripts/r7_workspace_trust_followup.py
          rustfmt --edition 2021 core/runtime-native/src/control_plane.rs
          git diff --check
      - name: Core gate
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path core/runtime-native/Cargo.toml
          cargo test --locked --manifest-path core/runtime-native/Cargo.toml
          cargo clippy --locked --manifest-path core/runtime-native/Cargo.toml --all-targets -- -D warnings
      - name: Commit refinement
        run: |
          set -euo pipefail
          if git diff --quiet -- core/runtime-native/src/control_plane.rs; then
            echo "Refinement already committed; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/runtime-native/src/control_plane.rs
          git diff --cached --check
          git commit -m "fix(r7): validate trust before workspace mutation"
          git push origin HEAD:codex/r7-workspace-trust-failclosed
