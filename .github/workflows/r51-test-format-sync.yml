name: R5.1 test format sync

on:
  push:
    branches:
      - feat/r5.1-runtime-human-control

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r5.1-runtime-human-control
          fetch-depth: 0
      - name: Normalize test spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/test_server.py")
          s = p.read_text(encoding="utf-8")
          old = '    assert [m["content"] for m in user_messages] == ["first", "second"]\n\ndef test_ws_rate_limits_inbound_frames(tmp_path):'
          new = '    assert [m["content"] for m in user_messages] == ["first", "second"]\n\n\ndef test_ws_rate_limits_inbound_frames(tmp_path):'
          if s.count(old) != 1:
              raise SystemExit("expected steering test boundary not found exactly once")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/r51-test-format-sync.yml").unlink()
          PY
      - name: Commit formatting repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(r5.1): normalize steering regression spacing"
          git push origin HEAD:feat/r5.1-runtime-human-control
