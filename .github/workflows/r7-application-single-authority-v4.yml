name: R7 Application Single Authority v4

on:
  push:
    branches:
      - codex/r7-application-single-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/r7-application-single-authority
      - name: Apply Application hard cut
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/r7_application_patch.py
          rustfmt --edition 2021 core/runtime-native/src/application.rs
          git diff --check
      - name: Run focused Application tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path core/runtime-native/Cargo.toml application::tests
      - name: Commit product change and remove staging artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r7-application-single-authority.yml
          rm -f .github/workflows/r7-application-single-authority-v2.yml
          rm -f .github/workflows/r7-application-single-authority-v3.yml
          rm -f .github/workflows/r7-application-single-authority-v4.yml
          rm -f .github/tmp/r7_application_patch.py
          rmdir .github/tmp 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(r7): hard-cut Application to one authority'
          git push origin HEAD:codex/r7-application-single-authority
