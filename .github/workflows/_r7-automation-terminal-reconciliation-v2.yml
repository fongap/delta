name: R7 Automation Terminal Reconciliation v2

on:
  push:
    branches:
      - codex/r7-automation-terminal-reconciliation

permissions:
  contents: write

jobs:
  fix-generator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/r7-automation-terminal-reconciliation

      - name: Fix generated RuntimeEvent match arm
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/_r7-automation-terminal-reconciliation.yml')
          text = path.read_text()
          old = '                json!({"error": error, "error_type": error_type, "terminal": terminal}),\\n            )\','
          new = '                json!({"error": error, "error_type": error_type, "terminal": terminal}),\\n            ),\','
          if text.count(old) != 1:
              raise SystemExit(f'expected one match-arm generator target, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit fix and self-delete
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_r7-automation-terminal-reconciliation-v2.yml
          git add .github/workflows/_r7-automation-terminal-reconciliation.yml
          git diff --cached --check
          git commit -m "chore(r7): fix reconciliation generator syntax"
          git push origin HEAD:codex/r7-automation-terminal-reconciliation
