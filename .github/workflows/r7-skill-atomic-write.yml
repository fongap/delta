name: R7 Skill Atomic Write

on:
  push:
    branches:
      - codex/r7-skill-atomic-write

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/r7-skill-atomic-write
      - name: Patch Skill authority writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/runtime-native/src/skills.rs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'use crate::ShadowReadError;',
                  'use crate::{durability::atomic_write, ShadowReadError};',
              ),
              (
                  '\n'.join([
                      '        std::fs::write(',
                      '            self.state_dir.join("session-skills.json"),',
                      '            serde_json::to_vec_pretty(&overrides)?,',
                      '        )?;',
                  ]),
                  '\n'.join([
                      '        let bytes = serde_json::to_vec_pretty(&overrides)?;',
                      '        atomic_write(self.state_dir.join("session-skills.json"), &bytes)?;',
                  ]),
              ),
              (
                  '\n'.join([
                      '        std::fs::write(',
                      '            self.state_dir.join("skills-settings.json"),',
                      '            serde_json::to_vec_pretty(&json!({"disabled": disabled}))?,',
                      '        )?;',
                  ]),
                  '\n'.join([
                      '        let bytes = serde_json::to_vec_pretty(&json!({"disabled": disabled}))?;',
                      '        atomic_write(self.state_dir.join("skills-settings.json"), &bytes)?;',
                  ]),
              ),
              (
                  '    std::fs::write(folder.join("SKILL.md"), text)?;',
                  '    atomic_write(folder.join("SKILL.md"), text.as_bytes())?;',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          rustfmt --edition 2021 core/runtime-native/src/skills.rs
          git diff --check
      - name: Commit product change and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r7-skill-atomic-write.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/runtime-native/src/skills.rs .github/workflows/r7-skill-atomic-write.yml
          git diff --cached --check
          git commit -m 'fix(r7): persist skill authority atomically'
          git push origin HEAD:codex/r7-skill-atomic-write
