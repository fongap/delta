name: R5.1 composer contract sync

on:
  push:
    branches:
      - feat/r5.1-runtime-human-control

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r5.1-runtime-human-control
          fetch-depth: 0
      - name: Preserve disabled reasoning control during active run
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("apps/desktop/src/components/Composer.tsx")
          s = p.read_text(encoding="utf-8")
          old = '            <span className="ml-auto" />\n            <button className="btn danger" onClick={props.onInterrupt}>'
          new = '            <span className="ml-auto" />\n            {props.onReasoningEffortChange && (\n              <ReasoningMenu\n                value={props.reasoningEffort || "auto"}\n                disabled={true}\n                onChange={props.onReasoningEffortChange}\n              />\n            )}\n            <button className="btn danger" onClick={props.onInterrupt}>'
          if s.count(old) != 1:
              raise SystemExit("active-run composer control boundary not found exactly once")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/r51-composer-contract-sync.yml").unlink()
          PY
      - name: Commit composer contract repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(r5.1): preserve disabled reasoning control while steering"
          git push origin HEAD:feat/r5.1-runtime-human-control
