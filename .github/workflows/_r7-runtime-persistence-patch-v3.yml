name: R7 Runtime Persistence Patch v3

on:
  push:
    branches:
      - codex/r7-runtime-persistence-failclosed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/r7-runtime-persistence-failclosed
      - name: Apply structural patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime_path = Path('core/runtime-native/src/runtime.rs')
          desktop_path = Path('apps/desktop/src-tauri/src/runtime_ipc.rs')
          runtime = runtime_path.read_text()
          desktop = desktop_path.read_text()

          def sub(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one structural match, got {count}')
              return updated

          runtime = sub(
              runtime,
              r'pub trait EventSink: Send \+ Sync \{.*?impl EventSink for NullSink \{.*?\n\}\n(?=\n#\[derive\(Debug, Clone\)\]\npub struct ToolCall)',
              '''pub trait EventSink: Send + Sync {
              fn emit(&self, frame: Value) -> Result<(), String>;
          }

          /// Default sink: write the frame as one JSON line to stdout.
          pub struct StdoutSink;
          impl EventSink for StdoutSink {
              fn emit(&self, frame: Value) -> Result<(), String> {
                  let mut stdout = std::io::stdout();
                  writeln!(stdout, "{frame}").map_err(|error| error.to_string())?;
                  stdout.flush().map_err(|error| error.to_string())?;
                  Ok(())
              }
          }

          /// Silent sink: drop every event (tests, headless runners).
          pub struct NullSink;
          impl EventSink for NullSink {
              fn emit(&self, _: Value) -> Result<(), String> {
                  Ok(())
              }
          }
          ''',
              'EventSink contract',
              re.S,
          )

          runtime = sub(
              runtime,
              r'#\[derive\(Clone\)\]\nstruct RuntimeEventEmitter \{.*?\n\}\n\nimpl RuntimeEventEmitter \{.*?\n\}\n(?=\n/// Provider-private stream frames)',
              '''#[derive(Clone)]
          struct RuntimeEventEmitter {
              session_id: String,
              sequence: Arc<Mutex<u64>>,
              sink: Arc<dyn EventSink>,
              event_error: Arc<Mutex<Option<String>>>,
          }

          impl RuntimeEventEmitter {
              fn emit(&self, event: RuntimeEvent) {
                  if self.event_error.lock().unwrap().is_some() {
                      return;
                  }
                  let frame = {
                      let mut sequence = self.sequence.lock().unwrap();
                      *sequence += 1;
                      event.to_frame(&self.session_id, *sequence)
                  };
                  if let Err(error) = self.sink.emit(frame) {
                      let mut event_error = self.event_error.lock().unwrap();
                      if event_error.is_none() {
                          *event_error = Some(error);
                      }
                  }
              }
          }
          ''',
              'RuntimeEventEmitter',
              re.S,
          )

          runtime = sub(
              runtime,
              r'(pub struct RuntimeHost \{.*?\n    sink: Arc<dyn EventSink>,)\n\}',
              r'\1\n    event_error: Arc<Mutex<Option<String>>>,\n}',
              'RuntimeHost field',
              re.S,
          )
          runtime = sub(
              runtime,
              r'(\n            sink: Arc::new\(NullSink\),)(\n        \}\n    \}\n\n    pub fn with_tools)',
              r'\1\n            event_error: Arc::new(Mutex::new(None)),\2',
              'RuntimeHost init',
          )

          runtime = sub(
              runtime,
              r'    fn emit_event\(&self, event: RuntimeEvent\) \{.*?(?=    fn outbound_messages\(&self\) -> Vec<Value> \{)',
              '''    fn emit_event(&self, event: RuntimeEvent) {
              self.event_emitter().emit(event);
          }

              fn clear_event_error(&self) {
              *self.event_error.lock().unwrap() = None;
          }

              fn ensure_event_delivery(&self) -> Result<(), String> {
              match self.event_error.lock().unwrap().clone() {
                  Some(error) => Err(format!("runtime event persistence failed: {error}")),
                  None => Ok(()),
              }
          }

              fn event_emitter(&self) -> RuntimeEventEmitter {
              RuntimeEventEmitter {
                  session_id: self.session_id.clone(),
                  sequence: self.sequence.clone(),
                  sink: self.sink.clone(),
                  event_error: self.event_error.clone(),
              }
          }

          ''',
              'RuntimeHost event helpers',
              re.S,
          )

          # Before any approval wait or capability execution, authoritative event persistence must be healthy.
          runtime = sub(
              runtime,
              r'(self\.emit_event\(RuntimeEvent::PermissionRequired \{.*?\n        \}\);)(\n        self\.ledger_append\()',
              r'\1\n        self.ensure_event_delivery()?;\2',
              'approval event guard',
              re.S,
          )
          runtime = sub(
              runtime,
              r'(match kind \{.*?\n            _ => unreachable!\(\),\n        \})(\n        let inbox_id = if self\.config\.unattended)',
              r'\1\n        if let Err(error) = self.ensure_event_delivery() {\n            self.interactions.cancel(&call.id);\n            return Some(ToolResult::failure(&call.id, error));\n        }\2',
              'interaction event guard',
              re.S,
          )
          runtime = sub(
              runtime,
              r'(self\.emit_event\(RuntimeEvent::ToolProposed \{.*?\n        \}\);)(\n        if let Err\(error\) = self\.ledger_append\()',
              r'\1\n        if let Err(error) = self.ensure_event_delivery() {\n            return ToolResult::failure(&call.id, error);\n        }\2',
              'tool proposed event guard',
              re.S,
          )
          runtime = sub(
              runtime,
              r'(self\.emit_event\(RuntimeEvent::ToolStarted \{.*?\n        \}\);)(\n        if let Err\(error\) = self\.ledger_append\(\n            "tool\.started")',
              r'\1\n        if let Err(error) = self.ensure_event_delivery() {\n            return ToolResult::failure(&call.id, error);\n        }\2',
              'tool started event guard',
              re.S,
          )

          # Every loop boundary catches failures from streamed deltas / prior UI protocol events.
          runtime = sub(
              runtime,
              r'(fn loop_turn\(&mut self\) -> Result<String, String> \{\n        let mut iterations = 0usize;\n        let mut turn_retries = 0u32;\n        loop \{)',
              r'\1\n            self.ensure_event_delivery()?;',
              'loop event guard',
          )
          runtime = sub(
              runtime,
              r'(self\.emit_event\(RuntimeEvent::AssistantMessage \{\n                message: assistant_message,.*?\n            \}\);)(\n            if turn\.tool_calls\.is_empty\(\))',
              r'\1\n            self.ensure_event_delivery()?;\2',
              'assistant message guard',
              re.S,
          )
          runtime = sub(
              runtime,
              r'(self\.emit_event\(RuntimeEvent::TurnEnd \{\n                    status: "completed"\.to_string\(\),\n                    iterations,\n                \}\);)(\n                return Ok\("completed"\.to_string\(\)\);)',
              r'\1\n                self.ensure_event_delivery()?;\2',
              'completed terminal guard',
          )
          runtime = sub(
              runtime,
              r'(self\.emit_event\(RuntimeEvent::TurnEnd \{\n                    status: "max_iterations_exceeded"\.to_string\(\),\n                    iterations,\n                \}\);)(\n                return Ok\("max_iterations_exceeded"\.to_string\(\)\);)',
              r'\1\n                self.ensure_event_delivery()?;\2',
              'max iterations terminal guard',
          )
          runtime = re.sub(
              r'(self\.emit_event\(RuntimeEvent::Interrupted \{ iterations \}\);)(\n\s*return Ok\("interrupted"\.to_string\(\)\);)',
              r'\1\n                self.ensure_event_delivery()?;\2',
              runtime,
          )

          # Fresh operation: clear sticky error, persist turn_start before state/model work.
          runtime = sub(
              runtime,
              r'(pub fn run_with_attachments\(.*?\n    \) -> Result<Value, String> \{)(\n        self\.emit_event\(RuntimeEvent::TurnStart)',
              r'\1\n        self.clear_event_error();\2',
              'run clear event error',
              re.S,
          )
          runtime = sub(
              runtime,
              r'(pub fn run_with_attachments\(.*?self\.emit_event\(RuntimeEvent::TurnStart \{.*?\n        \}\);)(\n        let mut message =)',
              r'\1\n        self.ensure_event_delivery()?;\2',
              'run turn_start guard',
              re.S,
          )
          runtime = sub(
              runtime,
              r'(pub fn resume\(&mut self\) -> Result<Value, String> \{)(\n        self\.emit_event\(RuntimeEvent::TurnStart)',
              r'\1\n        self.clear_event_error();\2',
              'resume clear event error',
          )
          runtime = sub(
              runtime,
              r'(pub fn resume\(&mut self\).*?self\.emit_event\(RuntimeEvent::TurnStart \{.*?\n        \}\);)(\n        self\.ledger_transition)',
              r'\1\n        self.ensure_event_delivery()?;\2',
              'resume turn_start guard',
              re.S,
          )
          runtime = sub(
              runtime,
              r'(pub fn retry\(&mut self\) -> Result<Value, String> \{)',
              r'\1\n        self.clear_event_error();',
              'retry clear event error',
          )
          runtime = sub(
              runtime,
              r'(pub fn retry\(&mut self\).*?self\.emit_event\(RuntimeEvent::TurnStart \{.*?\n        \}\);)(\n        self\.ledger_transition)',
              r'\1\n        self.ensure_event_delivery()?;\2',
              'retry turn_start guard',
              re.S,
          )

          # ModelChanged uses the same durable channel; command caller sees failure.
          runtime = sub(
              runtime,
              r'(RuntimeCommand::SwitchModel \{ change, reply \} => \{)(\n                let notice =)',
              r'\1\n                host.clear_event_error();\2',
              'model switch clear',
          )
          runtime = sub(
              runtime,
              r'(RuntimeCommand::SwitchModel \{ change, reply \} => \{.*?sync_message_snapshot\(&host, &messages\);)(\n                let _ = reply\.send\(Ok\(notice\)\);)',
              r'\1\n                let result = host.ensure_event_delivery().map(|_| notice);\n                let _ = reply.send(result);',
              'model switch result',
              re.S,
          )

          # Test sink contract + regression for a terminal persistence failure.
          runtime = sub(
              runtime,
              r'impl EventSink for CaptureSink \{\n        fn emit\(&self, frame: Value\) \{\n            self\.frames\.lock\(\)\.unwrap\(\)\.push\(frame\);\n        \}\n    \}',
              '''impl EventSink for CaptureSink {
              fn emit(&self, frame: Value) -> Result<(), String> {
                  self.frames.lock().unwrap().push(frame);
                  Ok(())
              }
          }''',
              'CaptureSink contract',
          )
          runtime = sub(
              runtime,
              r'(let emitter = RuntimeEventEmitter \{\n            session_id: "session-1"\.to_string\(\),\n            sequence: Arc::new\(Mutex::new\(0\)\),\n            sink: sink\.clone\(\),)(\n        \};)',
              r'\1\n            event_error: Arc::new(Mutex::new(None)),\2',
              'RuntimeEventEmitter test init',
          )
          runtime = sub(
              runtime,
              r'(\#\[derive\(Default\)\]\n    struct CaptureSink \{\n        frames: Mutex<Vec<Value>>,\n    \})(\n\n    struct MockProvider)',
              r'''\1

              struct FailOnTurnEndSink {
              frames: Mutex<Vec<Value>>,
          }

              impl EventSink for FailOnTurnEndSink {
              fn emit(&self, frame: Value) -> Result<(), String> {
                  if frame.get("type").and_then(Value::as_str) == Some("turn_end") {
                      return Err("simulated persistence failure".to_string());
                  }
                  self.frames.lock().unwrap().push(frame);
                  Ok(())
              }
          }\2''',
              'failure sink fixture',
          )
          runtime = sub(
              runtime,
              r'(    \#\[test\]\n    fn runtime_handle_runs_in_background_and_rejects_parallel_run\(\) \{)',
              '''    #[test]
              fn event_sink_failure_fails_run_and_suppresses_later_terminal_events() {
              let sink = Arc::new(FailOnTurnEndSink {
                  frames: Mutex::new(Vec::new()),
              });
              let mut host = RuntimeHost::new(
                  "session-persistence-failure",
                  RuntimeConfig {
                      max_iterations: 0,
                      ..RuntimeConfig::default()
                  },
              )
              .with_event_sink(sink.clone());

              let result = host.run("hello", None);
              assert!(result.as_ref().err().is_some_and(|error| {
                  error.contains("runtime event persistence failed")
              }));
              let frames = sink.frames.lock().unwrap();
              let event_types = frames
                  .iter()
                  .filter_map(|frame| frame.get("type").and_then(Value::as_str))
                  .collect::<Vec<_>>();
              assert_eq!(event_types, vec!["turn_start"]);
          }

              \1''',
              'persistence failure regression',
          )

          # Desktop sink: transcript persistence is authoritative. UI emission remains recoverable/best-effort.
          desktop = sub(
              desktop,
              r'impl EventSink for TauriEventSink \{\n    fn emit\(&self, frame: Value\) \{.*?\n    \}\n\}',
              '''impl EventSink for TauriEventSink {
              fn emit(&self, frame: Value) -> Result<(), String> {
                  delta_runtime_native::control_plane::record_runtime_event(&self.state_dir, &frame)
                      .map_err(|error| format!("persist runtime event: {error}"))?;
                  if frame.get("type").and_then(Value::as_str) == Some("turn_end") {
                      if let (Some(session_id), Some(status)) = (
                          frame.get("sessionId").and_then(Value::as_str),
                          frame
                              .get("payload")
                              .and_then(|payload| payload.get("status"))
                              .and_then(Value::as_str),
                      ) {
                          if session_id.starts_with("__run__") {
                              let _ = self
                                  .automations
                                  .lock()
                                  .unwrap()
                                  .finalize_session(session_id, status);
                          }
                      }
                  }
                  let _ = self.app.emit("delta-runtime-event", frame);
                  Ok(())
              }
          }''',
              'TauriEventSink',
              re.S,
          )

          runtime_path.write_text(runtime)
          desktop_path.write_text(desktop)
          PY

          rustfmt --edition 2021 core/runtime-native/src/runtime.rs apps/desktop/src-tauri/src/runtime_ipc.rs
          git diff --check
      - name: Commit product patch and delete staging workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_r7-runtime-persistence-patch.yml
          git rm .github/workflows/_r7-runtime-persistence-patch-v2.yml
          git rm .github/workflows/_r7-runtime-persistence-patch-v3.yml
          git add core/runtime-native/src/runtime.rs apps/desktop/src-tauri/src/runtime_ipc.rs
          git diff --cached --check
          git commit -m "fix(r7): fail closed on runtime event persistence errors"
          git push origin HEAD:codex/r7-runtime-persistence-failclosed
