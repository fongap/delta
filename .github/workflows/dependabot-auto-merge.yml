name: Dependabot Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  purge-orphan-workflow-history:
    name: Purge orphan workflow history
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read

    steps:
      - name: Remove orphan R5.1 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            local max=5
            local delay=2
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Command failed after ${max} attempts: $*"
                return 1
              fi
              echo "::warning::GitHub API call failed (attempt ${attempt}/${max}); retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          cat > orphan-workflows.tsv <<'EOF'
          356374905	R5.1 composer contract sync	.github/workflows/r51-composer-contract-sync.yml
          356384188	R5.1 fix steering regression assertion	.github/workflows/r51-fix-provider-count-test.yml
          356370656	R5.1 live steering repair	.github/workflows/r51-live-steering-repair.yml
          356371925	R5.1 live steering test sync	.github/workflows/r51-live-steering-test-sync.yml
          356373219	R5.1 test format sync	.github/workflows/r51-test-format-sync.yml
          EOF

          echo "Orphan workflow identities to purge:"
          cat orphan-workflows.tsv

          # Safety gate: none of these files may exist on main. If one has been
          # restored, abort rather than deleting history for a live workflow.
          while IFS=$'\t' read -r workflow_id workflow_name workflow_path; do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=main" --silent 2>/dev/null; then
              echo "::error::${workflow_path} exists on main; refusing to purge ${workflow_name}."
              exit 1
            fi
          done < orphan-workflows.tsv

          total_deleted_runs=0
          while IFS=$'\t' read -r workflow_id workflow_name workflow_path; do
            echo "Purging ${workflow_name} (${workflow_id})"

            while true; do
              run_ids_file="runs-${workflow_id}.txt"
              retry gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
                --jq '.workflow_runs[].id' > "$run_ids_file"

              batch_count="$(wc -l < "$run_ids_file" | tr -d ' ')"
              if [ "$batch_count" = "0" ]; then
                break
              fi

              echo "Deleting ${batch_count} run(s) from ${workflow_name}"
              while IFS= read -r run_id; do
                [ -z "$run_id" ] && continue
                retry gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --silent
                total_deleted_runs=$((total_deleted_runs + 1))
              done < "$run_ids_file"
            done

            remaining="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=1" --jq '.total_count')"
            if [ "$remaining" != "0" ]; then
              echo "::error::${workflow_name} still has ${remaining} run(s)."
              exit 1
            fi
            echo "${workflow_name}: 0 runs remain"
          done < orphan-workflows.tsv

          echo "Deleted ${total_deleted_runs} orphan workflow runs across 5 R5.1 workflow identities."

  enable-auto-merge:
    name: Enable auto-merge
    # Only Dependabot PRs are eligible for auto-merge. Anything else
    # (human PRs, fork PRs, etc.) is skipped at the job level so the
    # downstream ``Fetch Dependabot metadata`` step never runs and
    # never produces the "PR is not from Dependabot, nothing to do"
    # error that surfaces in the PR's checks UI. The legacy
    # ``Bail if not Dependabot`` step is kept as a defense-in-depth
    # early return in case a future change widens the job's
    # eligibility.
    if: >-
      github.repository == 'fongap/delta' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Bail if not Dependabot
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          echo "::notice::PR author is not dependabot[bot]; auto-merge skipped."
          exit 0

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ github.token }}

      - name: Check repository auto-merge setting
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled="$(
            gh api "repos/${GITHUB_REPOSITORY}" \
              --jq '.allow_auto_merge'
          )"

          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

          if [ "$enabled" = "true" ]; then
            echo "Repository auto-merge is enabled."
          else
            echo "::notice::Repository auto-merge is disabled; automatic merge will be skipped."
          fi

      - name: Show Dependabot update policy
        run: |
          echo "Dependencies: ${{ steps.metadata.outputs.dependency-names }}"
          echo "Ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}"
          echo "Directory: ${{ steps.metadata.outputs.directory }}"
          echo "Update type: ${{ steps.metadata.outputs.update-type }}"
          echo "Dependency group: ${{ steps.metadata.outputs.dependency-group }}"

      - name: Enable squash auto-merge for safe patch update
        id: auto-merge
        if: >
          steps.repo.outputs.enabled == 'true' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.dependency-group == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          already_enabled="$(
            gh pr view "$PR_URL" \
              --json autoMergeRequest \
              --jq '.autoMergeRequest != null'
          )"

          if [ "$already_enabled" = "true" ]; then
            echo "::notice::Auto-merge is already enabled."
            exit 0
          fi

          gh pr merge "$PR_URL" \
            --auto \
            --squash

      - name: Report auto-merge failure
        if: steps.auto-merge.outcome == 'failure'
        run: |
          echo "::error::Could not enable auto-merge. PR remains mergeable via manual squash merge."
          exit 0

      - name: Skip grouped update
        if: steps.metadata.outputs.dependency-group != ''
        run: |
          echo "::notice::Grouped Dependabot update requires manual review; auto-merge skipped."

      - name: Skip non-patch update
        if: steps.metadata.outputs.update-type != 'version-update:semver-patch'
        run: |
          echo "::notice::Only SemVer patch updates are eligible for auto-merge."