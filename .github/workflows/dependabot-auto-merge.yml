name: Dependabot Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  purge-deleted-workflow-history:
    name: Purge deleted workflow history
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read

    steps:
      - name: Remove every deleted workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            local max=5
            local delay=2
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Command failed after ${max} attempts: $*"
                return 1
              fi
              echo "::warning::GitHub API call failed (attempt ${attempt}/${max}); retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .name, .path, .state] | @tsv' \
            > workflows.tsv

          echo "Workflow inventory:"
          cat workflows.tsv

          awk -F '\t' '$4 == "deleted" {print $1}' workflows.tsv > deleted-workflow-ids.txt
          deleted_count="$(wc -l < deleted-workflow-ids.txt | tr -d ' ')"
          echo "Found ${deleted_count} deleted workflow identities."

          total_deleted_runs=0
          while IFS= read -r workflow_id; do
            [ -z "$workflow_id" ] && continue

            workflow_line="$(awk -F '\t' -v id="$workflow_id" '$1 == id {print; exit}' workflows.tsv)"
            echo "Purging workflow: ${workflow_line}"

            while true; do
              run_ids_file="runs-${workflow_id}.txt"
              : > "$run_ids_file"

              retry gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
                --jq '.workflow_runs[].id' \
                > "$run_ids_file"

              batch_count="$(wc -l < "$run_ids_file" | tr -d ' ')"
              if [ "$batch_count" = "0" ]; then
                break
              fi

              while IFS= read -r run_id; do
                [ -z "$run_id" ] && continue
                echo "Deleting run ${run_id} from workflow ${workflow_id}"
                retry gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --silent
                total_deleted_runs=$((total_deleted_runs + 1))
              done < "$run_ids_file"
            done
          done < deleted-workflow-ids.txt

          echo "Deleted ${total_deleted_runs} runs across ${deleted_count} deleted workflow identities."
          echo "Deleted workflow history purge complete."

  enable-auto-merge:
    name: Enable auto-merge
    # Only Dependabot PRs are eligible for auto-merge. Anything else
    # (human PRs, fork PRs, etc.) is skipped at the job level so the
    # downstream ``Fetch Dependabot metadata`` step never runs and
    # never produces the "PR is not from Dependabot, nothing to do"
    # error that surfaces in the PR's checks UI. The legacy
    # ``Bail if not Dependabot`` step is kept as a defense-in-depth
    # early return in case a future change widens the job's
    # eligibility.
    if: >-
      github.repository == 'fongap/delta' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Bail if not Dependabot
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          echo "::notice::PR author is not dependabot[bot]; auto-merge skipped."
          exit 0

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ github.token }}

      - name: Check repository auto-merge setting
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled="$(
            gh api "repos/${GITHUB_REPOSITORY}" \
              --jq '.allow_auto_merge'
          )"

          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

          if [ "$enabled" = "true" ]; then
            echo "Repository auto-merge is enabled."
          else
            echo "::notice::Repository auto-merge is disabled; automatic merge will be skipped."
          fi

      - name: Show Dependabot update policy
        run: |
          echo "Dependencies: ${{ steps.metadata.outputs.dependency-names }}"
          echo "Ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}"
          echo "Directory: ${{ steps.metadata.outputs.directory }}"
          echo "Update type: ${{ steps.metadata.outputs.update-type }}"
          echo "Dependency group: ${{ steps.metadata.outputs.dependency-group }}"

      - name: Enable squash auto-merge for safe patch update
        id: auto-merge
        if: >
          steps.repo.outputs.enabled == 'true' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.dependency-group == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          already_enabled="$(
            gh pr view "$PR_URL" \
              --json autoMergeRequest \
              --jq '.autoMergeRequest != null'
          )"

          if [ "$already_enabled" = "true" ]; then
            echo "::notice::Auto-merge is already enabled."
            exit 0
          fi

          gh pr merge "$PR_URL" \
            --auto \
            --squash

      - name: Report auto-merge failure
        if: steps.auto-merge.outcome == 'failure'
        run: |
          echo "::error::Could not enable auto-merge. PR remains mergeable via manual squash merge."
          exit 0

      - name: Skip grouped update
        if: steps.metadata.outputs.dependency-group != ''
        run: |
          echo "::notice::Grouped Dependabot update requires manual review; auto-merge skipped."

      - name: Skip non-patch update
        if: steps.metadata.outputs.update-type != 'version-update:semver-patch'
        run: |
          echo "::notice::Only SemVer patch updates are eligible for auto-merge."