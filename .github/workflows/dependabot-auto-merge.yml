name: Dependabot Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup-obsolete-actions-history:
    name: Cleanup obsolete Actions history
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete runs from obsolete workflow identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.workflow_id == 339182377 or .workflow_id == 346241682 or .workflow_id == 346241758) | .id' \
            > obsolete-run-ids.txt

          count="$(wc -l < obsolete-run-ids.txt | tr -d ' ')"
          echo "Found ${count} obsolete workflow runs."

          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "Deleting workflow run ${run_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done < obsolete-run-ids.txt

          echo "Obsolete workflow history cleanup complete."

  enable-auto-merge:
    name: Enable auto-merge
    # Only Dependabot PRs are eligible for auto-merge. Anything else
    # (human PRs, fork PRs, etc.) is skipped at the job level so the
    # downstream ``Fetch Dependabot metadata`` step never runs and
    # never produces the "PR is not from Dependabot, nothing to do"
    # error that surfaces in the PR's checks UI. The legacy
    # ``Bail if not Dependabot`` step is kept as a defense-in-depth
    # early return in case a future change widens the job's
    # eligibility.
    if: >-
      github.repository == 'fongap/delta' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Bail if not Dependabot
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          echo "::notice::PR author is not dependabot[bot]; auto-merge skipped."
          exit 0

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ github.token }}

      - name: Check repository auto-merge setting
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled="$(
            gh api "repos/${GITHUB_REPOSITORY}" \
              --jq '.allow_auto_merge'
          )"

          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

          if [ "$enabled" = "true" ]; then
            echo "Repository auto-merge is enabled."
          else
            echo "::notice::Repository auto-merge is disabled; automatic merge will be skipped."
          fi

      - name: Show Dependabot update policy
        run: |
          echo "Dependencies: ${{ steps.metadata.outputs.dependency-names }}"
          echo "Ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}"
          echo "Directory: ${{ steps.metadata.outputs.directory }}"
          echo "Update type: ${{ steps.metadata.outputs.update-type }}"
          echo "Dependency group: ${{ steps.metadata.outputs.dependency-group }}"

      - name: Enable squash auto-merge for safe patch update
        id: auto-merge
        if: >
          steps.repo.outputs.enabled == 'true' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.dependency-group == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          already_enabled="$(
            gh pr view "$PR_URL" \
              --json autoMergeRequest \
              --jq '.autoMergeRequest != null'
          )"

          if [ "$already_enabled" = "true" ]; then
            echo "::notice::Auto-merge is already enabled."
            exit 0
          fi

          gh pr merge "$PR_URL" \
            --auto \
            --squash

      - name: Report auto-merge failure
        if: steps.auto-merge.outcome == 'failure'
        run: |
          echo "::error::Could not enable auto-merge. PR remains mergeable via manual squash merge."
          exit 0

      - name: Skip grouped update
        if: steps.metadata.outputs.dependency-group != ''
        run: |
          echo "::notice::Grouped Dependabot update requires manual review; auto-merge skipped."

      - name: Skip non-patch update
        if: steps.metadata.outputs.update-type != 'version-update:semver-patch'
        run: |
          echo "::notice::Only SemVer patch updates are eligible for auto-merge."
