# Delta's release artifact is the relocatable Windows portable ZIP.
# A manual run from main reads the repository version, creates the matching tag,
# verifies the uploaded assets, and publishes the GitHub Release automatically.

name: Portable Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate release source and version
        id: release
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::releases must be dispatched from main (got $GITHUB_REF)"
            exit 1
          fi

          # Version-source consistency + CHANGELOG gate, shared with local runs
          # (scripts/check_release_versions.py — same checks, single source of truth).
          # Appends version=/tag= to GITHUB_OUTPUT exactly like the previous inline step.
          python3 scripts/check_release_versions.py --quiet

  build-portable:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            packaging/portable/launcher

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up sidecar build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[bedrock]" pyinstaller typer tzdata
          .\.venv\Scripts\python.exe -c "import aisuite; from core.cli import main; from services.server.run import main as server_main"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Windows portable release
        shell: pwsh
        run: .\packaging\portable\build_portable.ps1

      - name: Verify portable release assets
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath .\releases -File)
          $zip = @($files | Where-Object Name -Like 'Delta-Windows-Portable.zip')
          $sum = @($files | Where-Object Name -Like 'Delta-Windows-Portable.zip.sha256')
          if ($files.Count -ne 2 -or $zip.Count -ne 1 -or $sum.Count -ne 1) {
            throw "releases/ must contain exactly one portable ZIP and its SHA256 file"
          }
          $expected = (Get-Content -LiteralPath $sum[0].FullName -Raw).Trim()
          $actual = (Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "portable SHA256 mismatch" }
          $entries = @(& tar -tf $zip[0].FullName)
          if (-not $entries.Count -or @($entries | Where-Object { $_ -notlike 'Delta/*' }).Count) {
            throw "portable ZIP must contain exactly one Delta/ top-level directory"
          }
          Write-Host "Verified $($zip[0].FullName)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portable-${{ needs.prepare.outputs.tag }}
          path: |
            releases/Delta-Windows-Portable.zip
            releases/Delta-Windows-Portable.zip.sha256
          if-no-files-found: error

  release:
    needs: [prepare, build-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-portable-${{ needs.prepare.outputs.tag }}
          path: dist

      - name: Validate commit and assets
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch origin main --no-tags
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::main advanced during the build ($GITHUB_SHA -> $MAIN_SHA); dispatch again"
            exit 1
          fi

          ZIP="dist/Delta-Windows-Portable.zip"
          SUM="${ZIP}.sha256"
          [ -f "$ZIP" ] && [ -f "$SUM" ] || {
            echo "::error::portable release assets are incomplete"
            exit 1
          }
          [ "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2 ] || {
            echo "::error::portable release must contain exactly two assets"
            exit 1
          }
          echo "$(tr -d '\r' < "$SUM")  $ZIP" | sha256sum --check --status

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already points to $TAG_SHA instead of $GITHUB_SHA"
              exit 1
            fi
          fi

      - name: Verify CI passed for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release preflight: the commit being published must have a SUCCESSFUL CI
          # run. "main didn't move" alone is not enough — a commit whose CI failed
          # (red pytest / cargo-deny / ruff baseline regression / clippy) could still
          # be dispatched. Require conclusion == success on the CI workflow for THIS
          # exact SHA; no run, running, or non-success conclusion -> refuse release.
          echo "Checking CI status for $GITHUB_SHA"
          RUNS=$(gh run list --workflow=ci.yml --branch=main --commit="$GITHUB_SHA" \
            --json status,conclusion,headSha,databaseId)
          if [ "$(echo "$RUNS" | jq 'length')" -eq 0 ]; then
            echo "::error::no CI run found for $GITHUB_SHA — refusing to release"
            exit 1
          fi
          STATUS=$(echo "$RUNS" | jq -r '.[0].status')
          CONCLUSION=$(echo "$RUNS" | jq -r '.[0].conclusion')
          HEAD_SHA=$(echo "$RUNS" | jq -r '.[0].headSha')
          echo "CI run: status=$STATUS conclusion=$CONCLUSION headSha=$HEAD_SHA"
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::CI run headSha ($HEAD_SHA) != release SHA ($GITHUB_SHA)"
            exit 1
          fi
          if [ "$STATUS" != "completed" ]; then
            echo "::error::CI is still running ($STATUS) — wait for it to finish, then dispatch again"
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI for $GITHUB_SHA concluded $CONCLUSION (not success) — refusing to release"
            exit 1
          fi
          echo "CI for $GITHUB_SHA is green; proceeding."

      - name: Create or resume draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if RELEASE_JSON=$(gh release view "$TAG" --json isDraft 2>/dev/null); then
            if [ "$(jq -r .isDraft <<<"$RELEASE_JSON")" != "true" ]; then
              echo "::error::$TAG is already published"
              exit 1
            fi
            echo "Resuming existing draft release $TAG"
          elif git show-ref --verify --quiet "refs/tags/$TAG"; then
            gh release create "$TAG" --verify-tag --title "$TAG" --draft --generate-notes
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --draft --generate-notes
          fi

      - name: Upload and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/* --clobber

          ASSETS=$(gh release view "$TAG" --json assets)
          EXPECTED='["Delta-Windows-Portable.zip","Delta-Windows-Portable.zip.sha256"]'
          ACTUAL=$(jq -c '[.assets[].name] | sort' <<<"$ASSETS")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::unexpected release assets: $ACTUAL"
            exit 1
          fi

          mkdir verified-download
          gh release download "$TAG" --dir verified-download \
            --pattern 'Delta-Windows-Portable.zip' \
            --pattern 'Delta-Windows-Portable.zip.sha256'
          cd verified-download
          echo "$(tr -d '\r' < Delta-Windows-Portable.zip.sha256)  Delta-Windows-Portable.zip" \
            | sha256sum --check --status

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest
          URL=$(gh release view "$TAG" --json url --jq .url)
          echo "Published $URL" | tee -a "$GITHUB_STEP_SUMMARY"
