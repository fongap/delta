# Delta's release artifact is the relocatable Windows portable ZIP.
# Tag pushes create a DRAFT GitHub Release for manual verification and publication.

name: Portable Release

on:
  push:
    tags: ["v*", "app-v*"]
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            surfaces/gui/src-tauri
            packaging/portable/launcher

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up sidecar build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[bedrock]" pyinstaller typer tzdata
          .\.venv\Scripts\python.exe -c "import aisuite, coworker"

      - name: Install frontend dependencies
        working-directory: surfaces/gui
        run: npm ci

      - name: Build Windows portable release
        shell: pwsh
        run: .\packaging\build_portable.ps1

      - name: Verify portable release assets
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath .\releases -File)
          $zip = @($files | Where-Object Name -Like 'Delta-Windows-Portable.zip')
          $sum = @($files | Where-Object Name -Like 'Delta-Windows-Portable.zip.sha256')
          if ($files.Count -ne 2 -or $zip.Count -ne 1 -or $sum.Count -ne 1) {
            throw "releases/ must contain exactly one portable ZIP and its SHA256 file"
          }
          $expected = (Get-Content -LiteralPath $sum[0].FullName -Raw).Trim()
          $actual = (Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "portable SHA256 mismatch" }
          $entries = @(& tar -tf $zip[0].FullName)
          if (-not $entries.Count -or @($entries | Where-Object { $_ -notlike 'Delta/*' }).Count) {
            throw "portable ZIP must contain exactly one Delta/ top-level directory"
          }
          Write-Host "Verified $($zip[0].FullName)"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            releases/Delta-Windows-Portable.zip
            releases/Delta-Windows-Portable.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/app-v')
    needs: build-portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: dist

      - name: Validate tag and assets
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#app-v}"
          VERSION="${VERSION#v}"
          CONF_VERSION=$(python3 -c "import json; print(json.load(open('surfaces/gui/src-tauri/tauri.conf.json'))['version'])")
          if [ "$VERSION" != "$CONF_VERSION" ]; then
            echo "::error::tag $TAG != tauri.conf.json version $CONF_VERSION"
            exit 1
          fi
          ZIP="dist/Delta-Windows-Portable.zip"
          SUM="${ZIP}.sha256"
          [ -f "$ZIP" ] && [ -f "$SUM" ] || {
            echo "::error::portable release assets are incomplete"
            exit 1
          }
          [ "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2 ] || {
            echo "::error::portable release must contain exactly two assets"
            exit 1
          }
          echo "$(cat "$SUM")  $ZIP" | sha256sum --check --status

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --generate-notes

      - name: Upload portable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/*
