# Delta Windows Portable Release
#
# Release policy:
# - Releases are manually dispatched from main.
# - Repository version consistency is checked before any expensive build starts.
# - The exact main commit being published must already have a successful CI run.
# - The portable application is built on Windows from the current source tree.
# - The resulting archive is checked for structure, metadata, executable bootability,
#   and SHA-256 integrity before it can be published.
# - GitHub Release is created as a draft first and published only after uploaded assets
#   have been downloaded again and independently verified.

name: Portable Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release
  cancel-in-progress: false


jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate release source and version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be dispatched from main (got $GITHUB_REF)"
            exit 1
          fi

          # Single source of truth for version consistency and CHANGELOG release gate.
          # The script appends version= and tag= to GITHUB_OUTPUT.
          python3 scripts/check_release_versions.py --quiet


  build-portable:
    name: build-portable
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # GitHub artifact attestation uses an ephemeral OIDC/Sigstore identity;
      # no long-lived signing secret is required for public release provenance.
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            packaging/portable/launcher

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Set up sidecar build environment
        shell: pwsh
        run: |
          uv sync --locked --extra bedrock --extra build
          uv pip check --python .venv\Scripts\python.exe

          # `delta` is the distribution/project name, not a Python package.
          # Smoke-test the real post-refactor entry points instead.
          .\.venv\Scripts\python.exe -c @"
          import aisuite
          import core
          import providers
          import integrations
          import packages
          import services
          from core.cli import main as cli_main
          from services.server.run import main as server_main
          print("Python runtime import smoke passed")
          "@

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Windows portable release
        shell: pwsh
        run: .\packaging\portable\build_portable.ps1

      - name: Verify portable release
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(Get-ChildItem -LiteralPath .\releases -File)

          $zip = @(
            $files |
              Where-Object Name -EQ "Delta-Windows-Portable.zip"
          )

          $sum = @(
            $files |
              Where-Object Name -EQ "Delta-Windows-Portable.zip.sha256"
          )

          if (
            $files.Count -ne 2 -or
            $zip.Count -ne 1 -or
            $sum.Count -ne 1
          ) {
            throw "releases/ must contain exactly the portable ZIP and its SHA256 file"
          }

          # Verify checksum emitted by the packaging script.
          $expectedHash = (Get-Content -LiteralPath $sum[0].FullName -Raw).Trim().ToLower()
          $actualHash = (
            Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256
          ).Hash.ToLower()

          if ($expectedHash -ne $actualHash) {
            throw "portable SHA256 mismatch"
          }

          # Archive must contain exactly one Delta/ top-level directory.
          $entries = @(& tar -tf $zip[0].FullName)

          if ($LASTEXITCODE -ne 0) {
            throw "unable to list portable ZIP"
          }

          if (
            -not $entries.Count -or
            @($entries | Where-Object { $_ -notlike "Delta/*" }).Count
          ) {
            throw "portable ZIP must contain exactly one Delta/ top-level directory"
          }

          # Extract the actual artifact. Validation after extraction catches packaging
          # mistakes that a source-tree build alone cannot detect.
          $verifyRoot = Join-Path $env:RUNNER_TEMP "delta-portable-verify"

          if (Test-Path -LiteralPath $verifyRoot) {
            Remove-Item -LiteralPath $verifyRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $verifyRoot | Out-Null

          & tar -xf $zip[0].FullName -C $verifyRoot

          if ($LASTEXITCODE -ne 0) {
            throw "unable to extract portable ZIP"
          }

          $requiredFiles = @(
            "Delta\Delta.exe",
            "Delta\App\Delta\Delta.exe",
            "Delta\App\Delta\sidecar\delta-server.exe",
            "Delta\Other\AppInfo\appinfo.xml"
          )

          foreach ($relativePath in $requiredFiles) {
            $absolutePath = Join-Path $verifyRoot $relativePath

            if (-not (Test-Path -LiteralPath $absolutePath -PathType Leaf)) {
              throw "portable artifact missing required file: $relativePath"
            }
          }

          # appinfo.xml must describe the exact release version selected in prepare.
          $appInfoPath = Join-Path $verifyRoot "Delta\Other\AppInfo\appinfo.xml"
          [xml]$appInfo = Get-Content -LiteralPath $appInfoPath -Raw

          $actualVersion = [string]$appInfo.appinfo.version

          if ($actualVersion -ne $env:EXPECTED_VERSION) {
            throw "portable metadata version mismatch: expected $($env:EXPECTED_VERSION), got $actualVersion"
          }

          # Boot the packaged PyInstaller sidecar itself. `--help` exercises the actual
          # packaged executable/import graph without opening a listening port or making
          # model/network requests.
          $serverExe = Join-Path $verifyRoot "Delta\App\Delta\sidecar\delta-server.exe"
          $smokeState = Join-Path $env:RUNNER_TEMP "delta-portable-smoke-state"

          if (Test-Path -LiteralPath $smokeState) {
            Remove-Item -LiteralPath $smokeState -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $smokeState | Out-Null

          $oldStateDir = $env:DELTA_STATE_DIR
          $env:DELTA_STATE_DIR = $smokeState

          try {
            & $serverExe --help

            if ($LASTEXITCODE -ne 0) {
              throw "packaged delta-server smoke failed (exit $LASTEXITCODE)"
            }
          }
          finally {
            $env:DELTA_STATE_DIR = $oldStateDir
          }

          Write-Host "Portable artifact verification passed:"
          Write-Host "  ZIP     : $($zip[0].FullName)"
          Write-Host "  SHA-256 : $actualHash"
          Write-Host "  Version : $actualVersion"

      - name: Attest portable ZIP provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: releases/Delta-Windows-Portable.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portable-${{ needs.prepare.outputs.tag }}
          path: |
            releases/Delta-Windows-Portable.zip
            releases/Delta-Windows-Portable.zip.sha256
          if-no-files-found: error
          retention-days: 7


  release:
    name: release
    needs:
      - prepare
      - build-portable

    runs-on: ubuntu-latest
    timeout-minutes: 20

    # contents:write is required to create/tag/publish the GitHub Release.
    # actions:read is required by `gh run list` below when verifying CI.
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-portable-${{ needs.prepare.outputs.tag }}
          path: dist

      - name: Validate commit and assets
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          # Refuse to publish a stale build if main advanced while Windows was building.
          git fetch origin main --no-tags

          MAIN_SHA=$(git rev-parse origin/main)

          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::main advanced during the build ($GITHUB_SHA -> $MAIN_SHA); dispatch again"
            exit 1
          fi

          ZIP="dist/Delta-Windows-Portable.zip"
          SUM="${ZIP}.sha256"

          if [ ! -f "$ZIP" ] || [ ! -f "$SUM" ]; then
            echo "::error::portable release assets are incomplete"
            exit 1
          fi

          # The build artifact is deliberately restricted to exactly these two
          # files. The SBOM is generated in the release job below.
          ASSET_COUNT=$(find dist -maxdepth 1 -type f | wc -l)

          if [ "$ASSET_COUNT" -ne 2 ]; then
            echo "::error::portable build artifact must contain exactly ZIP and checksum"
            exit 1
          fi

          echo "$(tr -d '\r' < "$SUM")  $ZIP" |
            sha256sum --check --status

          # Existing tag is acceptable only if it already identifies this exact commit.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"

            TAG_SHA=$(git rev-list -n 1 "$TAG")

            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already points to $TAG_SHA instead of $GITHUB_SHA"
              exit 1
            fi
          fi

      - name: Generate release CycloneDX SBOM
        # Syft discovers the committed uv.lock, package-lock.json, and Cargo.lock
        # files from the exact source commit that built this release.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/Delta-Windows-Portable.sbom.cdx.json
          artifact-name: delta-release-sbom
          upload-artifact: false
          upload-release-assets: false

      - name: Verify CI passed for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Checking CI status for $GITHUB_SHA"

          RUNS=$(
            gh run list \
              --workflow=ci.yml \
              --branch=main \
              --commit="$GITHUB_SHA" \
              --limit=10 \
              --json status,conclusion,headSha,databaseId
          )

          if [ "$(echo "$RUNS" | jq 'length')" -eq 0 ]; then
            echo "::error::no CI run found for $GITHUB_SHA — refusing to release"
            exit 1
          fi

          SUCCESS_COUNT=$(
            echo "$RUNS" |
              jq --arg sha "$GITHUB_SHA" '
                [
                  .[]
                  | select(
                      .headSha == $sha
                      and .status == "completed"
                      and .conclusion == "success"
                    )
                ]
                | length
              '
          )

          if [ "$SUCCESS_COUNT" -lt 1 ]; then
            echo "::error::no successful completed CI run exists for $GITHUB_SHA"
            echo "$RUNS" | jq .
            exit 1
          fi

          echo "CI for $GITHUB_SHA is green; proceeding."

      - name: Create or resume draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if RELEASE_JSON=$(gh release view "$TAG" --json isDraft 2>/dev/null); then
            if [ "$(jq -r .isDraft <<<"$RELEASE_JSON")" != "true" ]; then
              echo "::error::$TAG is already published"
              exit 1
            fi

            echo "Resuming existing draft release $TAG"

          elif git show-ref --verify --quiet "refs/tags/$TAG"; then
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --draft \
              --generate-notes

          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --draft \
              --generate-notes
          fi

      - name: Upload and independently verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$TAG" dist/* --clobber

          ASSETS=$(gh release view "$TAG" --json assets)

          EXPECTED='["Delta-Windows-Portable.sbom.cdx.json","Delta-Windows-Portable.zip","Delta-Windows-Portable.zip.sha256"]'
          ACTUAL=$(jq -c '[.assets[].name] | sort' <<<"$ASSETS")

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::unexpected release assets: $ACTUAL"
            exit 1
          fi

          rm -rf verified-download
          mkdir verified-download

          gh release download "$TAG" \
            --dir verified-download \
            --pattern "Delta-Windows-Portable.zip" \
            --pattern "Delta-Windows-Portable.zip.sha256"

          cd verified-download

          echo "$(tr -d '\r' < Delta-Windows-Portable.zip.sha256)  Delta-Windows-Portable.zip" |
            sha256sum --check --status

          echo "downloaded GitHub Release assets passed SHA-256 verification"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          gh release edit "$TAG" \
            --draft=false \
            --latest

          URL=$(gh release view "$TAG" --json url --jq .url)

          {
            echo "## Delta Release"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Release: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Published $URL"
