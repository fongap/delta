# Delta CI
#
# Coverage:
# - Python runtime tests on supported Linux versions and Windows
# - Desktop TypeScript/unit tests
# - Hermetic Playwright e2e tests
# - Python/npm/Rust dependency advisory gates
# - Python static-analysis regression gates
# - Rust fmt/check/clippy/tests
# - Repository layout invariants
#
# Supply-chain policy:
# - Third-party GitHub Actions are pinned to immutable commit SHAs.
# - Tool versions that affect security/static baselines are explicitly pinned.
# - The root deny.toml is explicitly supplied to cargo-deny.
#
# Branch protection:
# - The main Ruleset requires only the stable `ci-required` job.
# - Individual job names may evolve without stranding GitHub Required Checks.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Keep the declared Python support range continuously verified. Windows
        # remains on the primary version to keep the platform matrix bounded.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --extra messaging --extra dev --extra bedrock
          uv pip check --python .venv/bin/python

      - name: Runtime contract schemas
        run: uv run --locked pytest tests/test_ui_runtime_contracts.py -q

      - name: Test
        # test_ui_runtime_contracts.py already ran above as an explicit contract gate.
        run: uv run --locked pytest tests -q --ignore=tests/test_ui_runtime_contracts.py


  pytest-windows:
    name: pytest-windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install
        shell: pwsh
        run: |
          uv sync --locked --extra messaging --extra dev --extra bedrock
          uv pip check --python .venv\Scripts\python.exe

      - name: Test
        run: uv run --locked pytest tests -q


  desktop-unit:
    name: desktop-unit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: npm ci
        working-directory: apps/desktop
        run: npm ci

      - name: Dependency advisories
        working-directory: apps/desktop
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Runtime contract fixtures
        working-directory: apps/desktop
        run: >
          npx vitest run
          src/api.contract.test.ts
          src/runtime-contract.test.ts
          src/api.auth.test.ts

      - name: Unit tests
        working-directory: apps/desktop
        run: npm test


  desktop-e2e:
    name: desktop-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: npm ci
        working-directory: apps/desktop
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      - name: e2e
        working-directory: apps/desktop
        run: npm run e2e


  python-advisories:
    name: python-advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install full dependency set
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --extra messaging --extra dev --extra bedrock
          uv pip check --python .venv/bin/python

      - name: Dependency advisories
        run: uv run --locked pip-audit --skip-editable


  rust-advisories:
    name: rust-advisories
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Advisories — Tauri app
        working-directory: apps/desktop/src-tauri
        run: >
          cargo deny
          --config "$GITHUB_WORKSPACE/deny.toml"
          check advisories

      - name: Advisories — portable launcher
        working-directory: packaging/portable/launcher
        run: >
          cargo deny
          --config "$GITHUB_WORKSPACE/deny.toml"
          check advisories

      - name: Advisories — STT service
        working-directory: services/stt
        run: >
          cargo deny
          --config "$GITHUB_WORKSPACE/deny.toml"
          check advisories


  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install locked static-analysis environment
        shell: bash
        run: |
          set -euo pipefail

          # Ruff and Pyright versions are declared in the dev extra and fixed
          # by uv.lock. Upgrade them only with a deliberate baseline re-measurement.
          uv sync --locked --extra messaging --extra dev
          uv pip check --python .venv/bin/python

      - name: Ruff — blocking runtime-breaking classes
        run: >
          uv run --locked ruff check
          core
          providers
          integrations
          packages
          services/server
          apps/tui
          tests
          --select E9,F63,F7,F82

      # Existing lint debt is tolerated, but the number of findings may not increase.
      # Baselines should normally only move downward as debt is repaired.

      - name: Ruff full scan — baseline gate
        env:
          RUFF_BASELINE: "192"
        shell: bash
        run: |
          set -euo pipefail

          uv run --locked ruff check \
            core \
            providers \
            integrations \
            packages \
            services/server \
            apps/tui \
            tests \
            --output-format=json \
            > ruff-report.json || true

          uv run --locked python - <<'PY'
          import json
          import os

          baseline = int(os.environ["RUFF_BASELINE"])

          with open("ruff-report.json", "r", encoding="utf-8") as fh:
              findings = json.load(fh)

          if not isinstance(findings, list):
              raise SystemExit("invalid Ruff JSON report")

          count = len(findings)
          print(f"ruff findings: {count} (baseline {baseline})")

          if count > baseline:
              raise SystemExit(
                  f"ruff findings {count} > baseline {baseline} — "
                  "clean up the regression or deliberately revise the baseline"
              )
          PY

      - name: Pyright — baseline gate
        env:
          PYRIGHT_BASELINE: "581"
        shell: bash
        run: |
          set -euo pipefail

          uv run --locked pyright \
            core \
            providers \
            integrations \
            packages \
            services/server \
            apps/tui \
            --outputjson \
            > pyright-report.json || true

          uv run --locked python - <<'PY'
          import json
          import os

          baseline = int(os.environ["PYRIGHT_BASELINE"])

          with open("pyright-report.json", "r", encoding="utf-8") as fh:
              report = json.load(fh)

          summary = report.get("summary")
          if not isinstance(summary, dict):
              raise SystemExit("invalid Pyright JSON report: summary missing")

          count = summary.get("errorCount")
          if not isinstance(count, int):
              raise SystemExit("invalid Pyright JSON report: errorCount missing")

          print(f"pyright errors: {count} (baseline {baseline})")

          if count > baseline:
              raise SystemExit(
                  f"pyright errors {count} > baseline {baseline} — "
                  "clean up the regression or deliberately revise the baseline"
              )
          PY


  rust:
    name: rust (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: apps/desktop/src-tauri
            tauri-deps: true

          - workspace: packaging/portable/launcher
            tauri-deps: false

          # STT has its own lockfile and must be governed as an independent
          # crate, not merely compiled as a Tauri path dependency.
          - workspace: services/stt
            tauri-deps: false
            stt-audio-deps: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          components: rustfmt, clippy

      - name: Install Tauri Linux system dependencies
        if: ${{ matrix.tauri-deps }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      # cpal's Linux backend links ALSA independently of Tauri. Keep this separate
      # from the desktop GUI dependency set so the STT crate remains standalone.
      - name: Install STT Linux audio dependencies
        if: ${{ matrix.stt-audio-deps }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Stub sidecar binary for Tauri codegen
        if: ${{ matrix.tauri-deps }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apps/desktop/src-tauri/binaries
          touch apps/desktop/src-tauri/binaries/sidecar

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ matrix.workspace }}

      - name: Format
        working-directory: ${{ matrix.workspace }}
        run: cargo fmt --check

      - name: Check
        working-directory: ${{ matrix.workspace }}
        run: cargo check --locked

      - name: Clippy
        working-directory: ${{ matrix.workspace }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: cargo test --locked


  layout-check:
    name: layout-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Structural guard for the frozen repository responsibility layout.
    # Keep this job path-independent so repository refactors cannot accidentally
    # strand the stable ci-required branch-protection check.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Forbidden top-level directories
        shell: bash
        run: |
          set -euo pipefail

          for d in surfaces crates coworker assets src stt; do
            if [ -d "$d" ]; then
              echo "::error::Forbidden top-level directory '$d' present (see docs/architecture/repository-layout.md)"
              exit 1
            fi
          done

          echo "no forbidden top-level directories"

      - name: Legacy OpenWork runtime keys
        shell: bash
        run: |
          set -euo pipefail

          # The legacy localStorage key `openwork-theme` and event
          # `openwork:theme-pref` were migrated to Delta names.
          #
          # Three files are intentionally allowed to read the legacy key for
          # backward-compatible migration/pre-paint behavior:
          # - apps/desktop/src/theme.ts
          # - apps/desktop/index.html
          # - apps/desktop/src-tauri/src/lib.rs
          #
          # Any new occurrence elsewhere in runtime/test/script source fails CI.

          if grep -rn \
              "openwork-theme\|openwork:theme-pref" \
              apps \
              core \
              providers \
              integrations \
              packages \
              services \
              tests \
              scripts \
              --include='*.ts' \
              --include='*.tsx' \
              --include='*.html' \
              --include='*.rs' \
              --include='*.py' \
              --include='*.js' \
              --include='*.json' \
              --include='*.css' \
              2>/dev/null \
            | grep -v 'apps/desktop/src/theme.ts' \
            | grep -v 'apps/desktop/index.html' \
            | grep -v 'apps/desktop/src-tauri/src/lib.rs'
          then
            echo "::error::Legacy OpenWork theme runtime key found in source; use delta-theme / delta:theme-pref"
            exit 1
          fi

          echo "no unexpected legacy OpenWork theme keys"

      - name: Deprecated migrated paths
        shell: bash
        run: |
          set -euo pipefail

          # The script owns the historical-path pattern list.
          # Extend that list whenever another responsibility path migrates.
          python3 scripts/check_legacy_paths.py


  ci-required:
    name: ci-required
    if: ${{ always() && (github.event_name == 'pull_request' || !cancelled()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Stable single gate for the main-branch Ruleset.
    #
    # The Ruleset should continue requiring ONLY this job. A failure, cancellation,
    # or unexpected skip in any real gate below makes ci-required fail.

    needs:
      - pytest
      - pytest-windows
      - desktop-unit
      - desktop-e2e
      - static
      - python-advisories
      - rust-advisories
      - rust
      - layout-check

    steps:
      - name: Evaluate required checks
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_JSON"])

          failures = {
              name: details["result"]
              for name, details in results.items()
              if details["result"] != "success"
          }

          if failures:
              print("ci-required blocked by checks that did not succeed:")
              for name, result in failures.items():
                  print(f"  {name}: {result}")
              sys.exit(1)

          print("all required checks passed")
          PY
