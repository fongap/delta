# Delta CI
#
# Validation policy:
# - Pull Requests run checks according to the affected repository area.
# - Pushes to main always run the full CI suite.
# - Repository layout invariants always run.
# - ci-required remains the single stable Required Check for main.
#
# Coverage:
# - Python runtime tests on supported Linux versions and Windows
# - Desktop TypeScript/unit tests
# - Hermetic Playwright e2e tests
# - Python/npm/Rust dependency advisory gates
# - Python static-analysis regression gates
# - Rust fmt/check/clippy/tests
# - Repository layout invariants
#
# Supply-chain policy:
# - Third-party GitHub Actions are pinned to immutable commit SHAs.
# - Tool versions that affect security/static baselines are explicitly pinned.
# - The root deny.toml is explicitly supplied to cargo-deny.
#
# Dependency-advisory policy:
# - npm audit / pip-audit / cargo-deny can fail on newly disclosed upstream
#   advisories that are unrelated to the current diff. This is intentional:
#   advisory gates are a point-in-time check, not a diff check. If a PR goes
#   red here for a change it didn't make, open a dedicated dependency-bump PR
#   rather than loosening the gate.
#
# Branch protection:
# - The main Ruleset requires only the stable `ci-required` job.
# - Individual job names may evolve without stranding GitHub Required Checks.
# - main is only ever updated by merging an already-green PR, so the `push`
#   trigger does not need to be gated by `ci-required` itself: if two pushes
#   land close together, `concurrency.cancel-in-progress` may cancel the
#   older run's `ci-required` (see its `!cancelled()` guard below), and that
#   is expected, not a validation gap. If this repo ever allows direct pushes
#   to main outside of PR merges, this assumption must be revisited.
#
# ci-required maintenance note:
# - The "which jobs are required" logic is intentionally duplicated in two
#   places: each job's own `if:` (whether it *runs*) and the Python block in
#   `ci-required` (whether it must *succeed*). These must be changed together.
#   Search for "MUST STAY IN SYNC" in both locations before editing either.

name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      python: ${{ steps.filter.outputs.python }}
      desktop: ${{ steps.filter.outputs.desktop }}
      rust: ${{ steps.filter.outputs.rust }}
      python_advisories: ${{ steps.filter.outputs.python_advisories }}
      rust_advisories: ${{ steps.filter.outputs.rust_advisories }}
      full: ${{ steps.filter.outputs.full }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # main always receives the complete CI suite.
          if [ "$EVENT_NAME" = "push" ]; then
            {
              echo "python=true"
              echo "desktop=true"
              echo "rust=true"
              echo "python_advisories=true"
              echo "rust_advisories=true"
              echo "full=true"
            } >> "$GITHUB_OUTPUT"

            echo "push to main: full CI selected"
            exit 0
          fi

          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt

          python=false
          desktop=false
          rust=false
          python_advisories=false
          rust_advisories=false
          full=false

          while IFS= read -r path; do
            case "$path" in
              # CI workflow changes are validated against the complete suite.
              .github/workflows/*)
                full=true
                ;;

              # Python runtime and repository-level Python tests.
              core/*|providers/*|integrations/*|packages/*|services/server/*|apps/tui/*|tests/*)
                python=true
                ;;

              # Python dependency graph changes require runtime and advisory checks.
              pyproject.toml|uv.lock)
                python=true
                python_advisories=true
                ;;

              # Release-version gate implementation is covered by Python tests.
              scripts/check_release_versions.py)
                python=true
                ;;

              # Tauri Rust workspace.
              apps/desktop/src-tauri/*)
                rust=true
                ;;

              # Delta Core Rust runtime (R1 shadow-read).
              core/runtime-native/*)
                rust=true
                ;;

              # Standalone STT Rust workspace.
              services/stt/*)
                rust=true
                ;;

              # Portable launcher Rust workspace.
              packaging/portable/launcher/*)
                rust=true
                ;;

              # Desktop frontend.
              apps/desktop/*)
                desktop=true
                ;;

              # cargo-deny policy only affects Rust advisory validation.
              deny.toml)
                rust_advisories=true
                ;;

              # Other packaging changes are release-critical and receive full CI.
              packaging/*)
                full=true
                ;;
            esac
          done < changed-files.txt

          # Full validation overrides selective detection.
          if [ "$full" = true ]; then
            python=true
            desktop=true
            rust=true
            python_advisories=true
            rust_advisories=true
          fi

          {
            echo "python=$python"
            echo "desktop=$desktop"
            echo "rust=$rust"
            echo "python_advisories=$python_advisories"
            echo "rust_advisories=$rust_advisories"
            echo "full=$full"
          } >> "$GITHUB_OUTPUT"

          echo "Changed files:"
          cat changed-files.txt

          echo
          echo "Selected checks:"
          echo "  python              = $python"
          echo "  desktop             = $desktop"
          echo "  rust                = $rust"
          echo "  python_advisories   = $python_advisories"
          echo "  rust_advisories     = $rust_advisories"
          echo "  full                = $full"


  pytest:
    name: pytest (${{ matrix.python-version }})
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }} # MUST STAY IN SYNC with ci-required's PYTHON_REQUIRED
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        # Keep the declared Python support range continuously verified when
        # Python validation is required. Windows remains on the primary version
        # to keep the platform matrix bounded.
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install
        shell: bash
        run: |
          set -euo pipefail

          uv sync --locked --extra messaging --extra dev
          uv pip check --python .venv/bin/python

      - name: Runtime contract schemas
        run: uv run --locked pytest tests/test_ui_runtime_contracts.py -q

      - name: Test
        # test_ui_runtime_contracts.py already ran above as an explicit contract gate,
        # so it is excluded here to avoid running it twice.
        run: uv run --locked pytest tests -q --ignore=tests/test_ui_runtime_contracts.py


  pytest-windows:
    name: pytest-windows
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }} # MUST STAY IN SYNC with ci-required's PYTHON_REQUIRED
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install
        shell: pwsh
        run: |
          uv sync --locked --extra messaging --extra dev
          uv pip check --python .venv\Scripts\python.exe

      - name: Test
        run: uv run --locked pytest tests -q


  desktop-unit:
    name: desktop-unit
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }} # MUST STAY IN SYNC with ci-required's DESKTOP_REQUIRED
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: npm ci
        working-directory: apps/desktop
        run: npm ci

      - name: Dependency advisories
        working-directory: apps/desktop
        # See "Dependency-advisory policy" at the top of this file: this step
        # can fail on advisories unrelated to the current diff.
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Runtime contract fixtures
        working-directory: apps/desktop
        run: >
          npx vitest run
          src/api.contract.test.ts
          src/runtime-contract.test.ts
          src/api.auth.test.ts

      - name: Unit tests
        working-directory: apps/desktop
        # Contract fixtures already ran above as an explicit gate.
        run: >
          npm test --
          --exclude src/api.contract.test.ts
          --exclude src/runtime-contract.test.ts
          --exclude src/api.auth.test.ts


  desktop-e2e:
    name: desktop-e2e
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }} # MUST STAY IN SYNC with ci-required's DESKTOP_REQUIRED
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: npm ci
        working-directory: apps/desktop
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      - name: e2e
        working-directory: apps/desktop
        run: npm run e2e


  python-advisories:
    name: python-advisories
    needs: changes
    if: ${{ needs.changes.outputs.python_advisories == 'true' }} # MUST STAY IN SYNC with ci-required's PYTHON_ADVISORIES_REQUIRED
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install full dependency set
        shell: bash
        run: |
          set -euo pipefail

          uv sync --locked --extra messaging --extra dev
          uv pip check --python .venv/bin/python

      - name: Dependency advisories
        # See "Dependency-advisory policy" at the top of this file: this step
        # can fail on advisories unrelated to the current diff.
        run: uv run --locked pip-audit --skip-editable


  rust-advisories:
    name: rust-advisories
    needs: changes
    # MUST STAY IN SYNC with ci-required's RUST_ADVISORIES_REQUIRED, which
    # computes: rust_advisories OR rust (rust workspace changes always pull
    # in an advisories re-check, same as here).
    if: >-
      ${{
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.rust_advisories == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | tr -d '\r' | sed 's/.*"\(.*\)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Advisories — Tauri app
        working-directory: apps/desktop/src-tauri
        # See "Dependency-advisory policy" at the top of this file: this step
        # can fail on advisories unrelated to the current diff.
        run: >
          cargo deny
          --config "$GITHUB_WORKSPACE/deny.toml"
          check advisories

      - name: Advisories — portable launcher
        working-directory: packaging/portable/launcher
        run: >
          cargo deny
          --config "$GITHUB_WORKSPACE/deny.toml"
          check advisories

      - name: Advisories — STT service
        working-directory: services/stt
        run: >
          cargo deny
          --config "$GITHUB_WORKSPACE/deny.toml"
          check advisories

      - name: Advisories — Delta Core runtime
        working-directory: core/runtime-native
        run: >
          cargo deny
          --config "$GITHUB_WORKSPACE/deny.toml"
          check advisories


  static:
    name: static
    needs: changes
    # tests/* changes intentionally select static because Ruff scans tests.
    # Pyright currently does not scan tests, so its result may be unchanged
    # for a tests-only change.
    if: ${{ needs.changes.outputs.python == 'true' }} # MUST STAY IN SYNC with ci-required's PYTHON_REQUIRED
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install locked static-analysis environment
        shell: bash
        run: |
          set -euo pipefail

          # Ruff and Pyright versions are declared in the dev extra and fixed
          # by uv.lock. Upgrade them only with a deliberate baseline re-measurement.
          uv sync --locked --extra messaging --extra dev
          uv pip check --python .venv/bin/python

      - name: Ruff — blocking runtime-breaking classes
        run: >
          uv run --locked ruff check
          core
          providers
          integrations
          packages
          services/server
          apps/tui
          tests
          --select E9,F63,F7,F82

      # Ruff full scan — zero-error gate. The historical baseline of 182 findings
      # was retired when the codebase reached 0; any new finding now fails CI.
      - name: Ruff full scan — zero-error gate
        shell: bash
        run: |
          set -euo pipefail

          uv run --locked ruff check \
            core \
            providers \
            integrations \
            packages \
            services/server \
            apps/tui \
            tests \
            --output-format=json \
            > ruff-report.json || true

          uv run --locked python - <<'PY'
          import json
          import sys

          with open("ruff-report.json", "r", encoding="utf-8") as fh:
              findings = json.load(fh)

          if not isinstance(findings, list):
              raise SystemExit("invalid Ruff JSON report")

          count = len(findings)
          print(f"ruff findings: {count}")

          if count > 0:
              for f in findings:
                  print(f"  {f.get('filename','?')}:{f.get('location',{}).get('row','?')} "
                        f"{f.get('code','?')} {f.get('message','?')}")
              raise SystemExit(
                  f"ruff findings {count} > 0 — clean up the regression"
              )
          PY

      - name: Pyright — zero-error gate
        run: |
          uv run --locked pyright \
            core \
            providers \
            integrations \
            packages \
            services/server \
            apps/tui


  rust:
    name: rust (${{ matrix.workspace }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }} # MUST STAY IN SYNC with ci-required's RUST_REQUIRED
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false

      matrix:
        include:
          - workspace: apps/desktop/src-tauri
            tauri-deps: true

          - workspace: packaging/portable/launcher
            tauri-deps: false

          # Delta Core Rust runtime (shadow-read, no system deps).
          - workspace: core/runtime-native
            tauri-deps: false

          # STT has its own lockfile and must be governed as an independent
          # crate, not merely compiled as a Tauri path dependency.
          - workspace: services/stt
            tauri-deps: false
            stt-audio-deps: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | tr -d '\r' | sed 's/.*"\(.*\)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Install Tauri Linux system dependencies
        if: ${{ matrix.tauri-deps }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      # cpal's Linux backend links ALSA independently of Tauri. Keep this separate
      # from the desktop GUI dependency set so the STT crate remains standalone.
      - name: Install STT Linux audio dependencies
        if: ${{ matrix.stt-audio-deps }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Stub sidecar binary for Tauri codegen
        if: ${{ matrix.tauri-deps }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apps/desktop/src-tauri/binaries
          touch apps/desktop/src-tauri/binaries/sidecar

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ matrix.workspace }}

      - name: Format
        working-directory: ${{ matrix.workspace }}
        run: cargo fmt --check

      - name: Check
        working-directory: ${{ matrix.workspace }}
        run: cargo check --locked

      - name: Clippy
        working-directory: ${{ matrix.workspace }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: cargo test --locked


  layout-check:
    name: layout-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Structural guard for the frozen repository responsibility layout.
    # Keep this job path-independent so repository refactors cannot accidentally
    # strand the stable ci-required branch-protection check.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Forbidden top-level directories
        shell: bash
        run: |
          set -euo pipefail

          for d in surfaces crates coworker assets src stt; do
            if [ -d "$d" ]; then
              echo "::error::Forbidden top-level directory '$d' present (see docs/architecture/repository-layout.md)"
              exit 1
            fi
          done

          echo "no forbidden top-level directories"

      - name: Legacy OpenWork runtime keys
        shell: bash
        run: |
          set -euo pipefail

          # The legacy localStorage key `openwork-theme` and event
          # `openwork:theme-pref` were migrated to Delta names.
          #
          # Three files are intentionally allowed to read the legacy key for
          # backward-compatible migration/pre-paint behavior:
          # - apps/desktop/src/theme.ts
          # - apps/desktop/index.html
          # - apps/desktop/src-tauri/src/lib.rs
          #
          # Any new occurrence elsewhere in runtime/test/script source fails CI.

          if grep -rn \
              "openwork-theme\|openwork:theme-pref" \
              apps \
              core \
              providers \
              integrations \
              packages \
              services \
              tests \
              scripts \
              --include='*.ts' \
              --include='*.tsx' \
              --include='*.html' \
              --include='*.rs' \
              --include='*.py' \
              --include='*.js' \
              --include='*.json' \
              --include='*.css' \
              2>/dev/null \
            | grep -v 'apps/desktop/src/theme.ts' \
            | grep -v 'apps/desktop/index.html' \
            | grep -v 'apps/desktop/src-tauri/src/lib.rs'
          then
            echo "::error::Legacy OpenWork theme runtime key found in source; use delta-theme / delta:theme-pref"
            exit 1
          fi

          echo "no unexpected legacy OpenWork theme keys"

      - name: Deprecated migrated paths
        shell: bash
        run: |
          set -euo pipefail

          # The script owns the historical-path pattern list.
          # Extend that list whenever another responsibility path migrates.
          python3 scripts/check_legacy_paths.py


  ci-required:
    name: ci-required
    if: ${{ always() && (github.event_name == 'pull_request' || !cancelled()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Stable single gate for the main-branch Ruleset.
    #
    # Required jobs must succeed.
    # Jobs that were intentionally excluded by the change selector may be skipped.
    # Unexpected skip/failure/cancellation of a required job blocks the gate.
    #
    # MUST STAY IN SYNC: the `required = {...}` map and the RUST_ADVISORIES
    # derivation below must match each job's own `if:` condition above.
    # Search other jobs for "MUST STAY IN SYNC" when editing either side.

    needs:
      - changes
      - pytest
      - pytest-windows
      - desktop-unit
      - desktop-e2e
      - static
      - python-advisories
      - rust-advisories
      - rust
      - layout-check

    steps:
      - name: Evaluate required checks
        env:
          NEEDS_JSON: ${{ toJson(needs) }}

          PYTHON_REQUIRED: ${{ needs.changes.outputs.python }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}

          PYTHON_ADVISORIES_REQUIRED: >-
            ${{ needs.changes.outputs.python_advisories }}

          RUST_ADVISORIES_REQUIRED: >-
            ${{ needs.changes.outputs.rust_advisories }}

        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_JSON"])

          python_required = os.environ["PYTHON_REQUIRED"] == "true"
          desktop_required = os.environ["DESKTOP_REQUIRED"] == "true"
          rust_required = os.environ["RUST_REQUIRED"] == "true"

          python_advisories_required = (
              os.environ["PYTHON_ADVISORIES_REQUIRED"] == "true"
          )

          # Mirrors rust-advisories' own `if:` condition exactly:
          # rust workspace changes always pull in an advisories re-check too.
          rust_advisories_required = (
              os.environ["RUST_ADVISORIES_REQUIRED"] == "true"
              or rust_required
          )

          required = {
              "changes": True,
              "layout-check": True,

              "pytest": python_required,
              "pytest-windows": python_required,
              "static": python_required,

              "desktop-unit": desktop_required,
              "desktop-e2e": desktop_required,

              "python-advisories": python_advisories_required,

              "rust": rust_required,
              "rust-advisories": rust_advisories_required,
          }

          failures = {}

          for name, expected in required.items():
              result = results[name]["result"]

              if expected:
                  if result != "success":
                      failures[name] = result
              elif result not in {"success", "skipped"}:
                  failures[name] = result

          if failures:
              print("ci-required blocked by checks that did not succeed:")

              for name, result in failures.items():
                  print(f"  {name}: {result}")

              sys.exit(1)

          print("all required checks passed")
          PY
