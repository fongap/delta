name: R5.1 live steering test sync

on:
  push:
    branches:
      - feat/r5.1-runtime-human-control

permissions:
  contents: write

jobs:
  sync-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r5.1-runtime-human-control
          fetch-depth: 0

      - name: Update websocket steering regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_server.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_ws_allows_only_one_inflight_turn_per_session(tmp_path):
    import threading
    import time

    class SlowProvider(ProviderClient):
        def __init__(self):
            self._lock = threading.Lock()
            self.active = 0
            self.max_active = 0

        def complete(self, *, model, messages, tools=None, **settings):
            with self._lock:
                self.active += 1
                self.max_active = max(self.max_active, self.active)
            try:
                time.sleep(0.08)
                return _text("done")
            finally:
                with self._lock:
                    self.active -= 1

        def capabilities(self, model):
            return ModelCapabilities()

    provider = SlowProvider()
    manager = SessionManager(workspace=tmp_path, provider=provider)
    client = TestClient(create_app(manager))
    with client.websocket_connect("/ws/session/serialized") as ws:
        assert ws.receive_json()["type"] == "ready"
        ws.send_json({"type": "user_message", "text": "first"})
        ws.send_json({"type": "user_message", "text": "second"})

        types = []
        while "turn_done" not in types:
            types.append(ws.receive_json()["type"])

    assert "input_rejected" in types
    assert provider.max_active == 1
    engine = manager._runtimes["serialized"].engine
    user_messages = [m for m in engine.messages if m.get("role") == "user"]
    assert [m["content"] for m in user_messages] == ["first"]
'''
          new = '''def test_ws_routes_second_plain_text_to_active_turn_without_concurrency(tmp_path):
    import threading
    import time

    class SlowProvider(ProviderClient):
        def __init__(self):
            self._lock = threading.Lock()
            self.active = 0
            self.max_active = 0
            self.calls = 0

        def complete(self, *, model, messages, tools=None, **settings):
            with self._lock:
                self.active += 1
                self.max_active = max(self.max_active, self.active)
                self.calls += 1
                call_no = self.calls
            try:
                # Keep the first model call active long enough for the second websocket
                # frame to exercise the busy-session steering path deterministically.
                time.sleep(0.08)
                return _text(f"done-{call_no}")
            finally:
                with self._lock:
                    self.active -= 1

        def capabilities(self, model):
            return ModelCapabilities()

    provider = SlowProvider()
    manager = SessionManager(workspace=tmp_path, provider=provider)
    client = TestClient(create_app(manager))
    with client.websocket_connect("/ws/session/serialized") as ws:
        assert ws.receive_json()["type"] == "ready"
        ws.send_json({"type": "user_message", "text": "first"})
        ws.send_json({"type": "user_message", "text": "second"})

        types = []
        while "turn_done" not in types:
            types.append(ws.receive_json()["type"])

    # The second message steers the SAME active turn. It must neither be rejected
    # nor launch a concurrent model call.
    assert "input_rejected" not in types
    assert provider.max_active == 1
    assert provider.calls == 2
    engine = manager._runtimes["serialized"].engine
    user_messages = [m for m in engine.messages if m.get("role") == "user"]
    assert [m["content"] for m in user_messages] == ["first", "second"]
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one old websocket serialization test, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # One-shot workflow: remove itself from the resulting branch commit.
          Path(".github/workflows/r51-live-steering-test-sync.yml").unlink()
          PY

      - name: Commit regression update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(r5.1): cover busy-session live steering"
          git push origin HEAD:feat/r5.1-runtime-human-control
