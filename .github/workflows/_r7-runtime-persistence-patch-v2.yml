name: R7 Runtime Persistence Patch v2

on:
  push:
    branches:
      - codex/r7-runtime-persistence-failclosed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/r7-runtime-persistence-failclosed
      - name: Apply fail-closed event delivery patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          rp = Path('core/runtime-native/src/runtime.rs')
          dp = Path('apps/desktop/src-tauri/src/runtime_ipc.rs')
          runtime = rp.read_text()
          desktop = dp.read_text()

          def once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected 1 target, got {text.count(old)}')
              return text.replace(old, new, 1)

          # EventSink becomes fallible; stdout errors are no longer discarded.
          runtime = once(runtime,
          '''pub trait EventSink: Send + Sync {
              fn emit(&self, frame: Value);
          }

          /// Default sink: write the frame as one JSON line to stdout.
          pub struct StdoutSink;
          impl EventSink for StdoutSink {
              fn emit(&self, frame: Value) {
                  let mut stdout = std::io::stdout();
                  let _ = writeln!(stdout, "{frame}");
                  let _ = stdout.flush();
              }
          }

          /// Silent sink: drop every event (tests, headless runners).
          pub struct NullSink;
          impl EventSink for NullSink {
              fn emit(&self, _: Value) {}
          }
          ''',
          '''pub trait EventSink: Send + Sync {
              fn emit(&self, frame: Value) -> Result<(), String>;
          }

          /// Default sink: write the frame as one JSON line to stdout.
          pub struct StdoutSink;
          impl EventSink for StdoutSink {
              fn emit(&self, frame: Value) -> Result<(), String> {
                  let mut stdout = std::io::stdout();
                  writeln!(stdout, "{frame}").map_err(|error| error.to_string())?;
                  stdout.flush().map_err(|error| error.to_string())?;
                  Ok(())
              }
          }

          /// Silent sink: drop every event (tests, headless runners).
          pub struct NullSink;
          impl EventSink for NullSink {
              fn emit(&self, _: Value) -> Result<(), String> {
                  Ok(())
              }
          }
          ''', 'EventSink contract')

          runtime = once(runtime,
          '''#[derive(Clone)]
          struct RuntimeEventEmitter {
              session_id: String,
              sequence: Arc<Mutex<u64>>,
              sink: Arc<dyn EventSink>,
          }

          impl RuntimeEventEmitter {
              fn emit(&self, event: RuntimeEvent) {
                  let mut sequence = self.sequence.lock().unwrap();
                  *sequence += 1;
                  self.sink.emit(event.to_frame(&self.session_id, *sequence));
              }
          }
          ''',
          '''#[derive(Clone)]
          struct RuntimeEventEmitter {
              session_id: String,
              sequence: Arc<Mutex<u64>>,
              sink: Arc<dyn EventSink>,
              event_error: Arc<Mutex<Option<String>>>,
          }

          impl RuntimeEventEmitter {
              fn emit(&self, event: RuntimeEvent) {
                  if self.event_error.lock().unwrap().is_some() {
                      return;
                  }
                  let frame = {
                      let mut sequence = self.sequence.lock().unwrap();
                      *sequence += 1;
                      event.to_frame(&self.session_id, *sequence)
                  };
                  if let Err(error) = self.sink.emit(frame) {
                      let mut event_error = self.event_error.lock().unwrap();
                      if event_error.is_none() {
                          *event_error = Some(error);
                      }
                  }
              }
          }
          ''', 'RuntimeEventEmitter')

          runtime = once(runtime,
              '    sink: Arc<dyn EventSink>,\n}\n\n/// A queued steering/follow-up instruction',
              '    sink: Arc<dyn EventSink>,\n    event_error: Arc<Mutex<Option<String>>>,\n}\n\n/// A queued steering/follow-up instruction',
              'RuntimeHost field')
          runtime = once(runtime,
              '            sink: Arc::new(NullSink),\n        }\n    }\n\n    pub fn with_tools',
              '            sink: Arc::new(NullSink),\n            event_error: Arc::new(Mutex::new(None)),\n        }\n    }\n\n    pub fn with_tools',
              'RuntimeHost init')

          runtime = once(runtime,
          '''    fn emit_event(&self, event: RuntimeEvent) {
              self.event_emitter().emit(event);
          }

              fn event_emitter(&self) -> RuntimeEventEmitter {
              RuntimeEventEmitter {
                  session_id: self.session_id.clone(),
                  sequence: self.sequence.clone(),
                  sink: self.sink.clone(),
              }
          }
          ''',
          '''    fn emit_event(&self, event: RuntimeEvent) {
              self.event_emitter().emit(event);
          }

              fn clear_event_error(&self) {
              *self.event_error.lock().unwrap() = None;
          }

              fn ensure_event_delivery(&self) -> Result<(), String> {
              match self.event_error.lock().unwrap().clone() {
                  Some(error) => Err(format!("runtime event delivery failed: {error}")),
                  None => Ok(()),
              }
          }

              fn event_emitter(&self) -> RuntimeEventEmitter {
              RuntimeEventEmitter {
                  session_id: self.session_id.clone(),
                  sequence: self.sequence.clone(),
                  sink: self.sink.clone(),
                  event_error: self.event_error.clone(),
              }
          }
          ''', 'RuntimeHost event helpers')

          # Fail before approval/user waits or capability side effects when event persistence failed.
          runtime = once(runtime,
              '        });\n        self.ledger_append(\n            "approval.required",',
              '        });\n        self.ensure_event_delivery()?;\n        self.ledger_append(\n            "approval.required",',
              'approval event guard')
          runtime = once(runtime,
              '            _ => unreachable!(),\n        }\n        let inbox_id = if self.config.unattended {',
              '            _ => unreachable!(),\n        }\n        if let Err(error) = self.ensure_event_delivery() {\n            self.interactions.cancel(&call.id);\n            return Some(ToolResult::failure(&call.id, error));\n        }\n        let inbox_id = if self.config.unattended {',
              'interaction event guard')
          runtime = once(runtime,
              '            risk_level: Some(format!("{level:?}")),\n        });\n        if let Err(error) = self.ledger_append(',
              '            risk_level: Some(format!("{level:?}")),\n        });\n        if let Err(error) = self.ensure_event_delivery() {\n            return ToolResult::failure(&call.id, error);\n        }\n        if let Err(error) = self.ledger_append(',
              'tool proposed event guard')
          runtime = once(runtime,
              '            name: call.name.clone(),\n        });\n        if let Err(error) = self.ledger_append(\n            "tool.started",',
              '            name: call.name.clone(),\n        });\n        if let Err(error) = self.ensure_event_delivery() {\n            return ToolResult::failure(&call.id, error);\n        }\n        if let Err(error) = self.ledger_append(\n            "tool.started",',
              'tool started event guard')

          runtime = once(runtime,
              '        let mut turn_retries = 0u32;\n        loop {\n            if iterations >= self.config.max_iterations {',
              '        let mut turn_retries = 0u32;\n        loop {\n            self.ensure_event_delivery()?;\n            if iterations >= self.config.max_iterations {',
              'loop guard')
          runtime = once(runtime,
              '                    iterations,\n                });\n                return Ok("max_iterations_exceeded".to_string());',
              '                    iterations,\n                });\n                self.ensure_event_delivery()?;\n                return Ok("max_iterations_exceeded".to_string());',
              'max iteration terminal guard')
          runtime = once(runtime,
              '                self.emit_event(RuntimeEvent::Interrupted { iterations });\n                return Ok("interrupted".to_string());',
              '                self.emit_event(RuntimeEvent::Interrupted { iterations });\n                self.ensure_event_delivery()?;\n                return Ok("interrupted".to_string());',
              'first interrupted guard')

          # Any provider-stream event failure must stop before model output is acted on.
          runtime = once(runtime,
              '            if self.cancel.load(Ordering::Relaxed) && turn.is_none() {',
              '            self.ensure_event_delivery()?;\n            if self.cancel.load(Ordering::Relaxed) && turn.is_none() {',
              'post stream guard')
          runtime = once(runtime,
              '                self.emit_event(RuntimeEvent::AssistantMessage {\n                    message: assistant_message,\n                    text: turn.text.clone(),\n                    tool_calls: tool_call_names,\n                    reasoning: turn.reasoning.clone(),\n                    usage: turn.usage.clone(),\n                });\n                if turn.tool_calls.is_empty() {',
              '                self.emit_event(RuntimeEvent::AssistantMessage {\n                    message: assistant_message,\n                    text: turn.text.clone(),\n                    tool_calls: tool_call_names,\n                    reasoning: turn.reasoning.clone(),\n                    usage: turn.usage.clone(),\n                });\n                self.ensure_event_delivery()?;\n                if turn.tool_calls.is_empty() {',
              'assistant message guard')
          runtime = once(runtime,
              '                        iterations,\n                    });\n                    return Ok("completed".to_string());',
              '                        iterations,\n                    });\n                    self.ensure_event_delivery()?;\n                    return Ok("completed".to_string());',
              'completed terminal guard')
          runtime = once(runtime,
              '                    error: result.error.clone(),\n                });\n            }\n            self.emit_event(RuntimeEvent::IterationEnd {',
              '                    error: result.error.clone(),\n                });\n                self.ensure_event_delivery()?;\n            }\n            self.emit_event(RuntimeEvent::IterationEnd {',
              'tool finished guard')
          runtime = once(runtime,
              '            self.emit_event(RuntimeEvent::IterationEnd {\n                iteration: iterations,\n            });\n            if self.cancel.load(Ordering::Relaxed) {',
              '            self.emit_event(RuntimeEvent::IterationEnd {\n                iteration: iterations,\n            });\n            self.ensure_event_delivery()?;\n            if self.cancel.load(Ordering::Relaxed) {',
              'iteration guard')

          # Fresh runs reset the sticky error; the first event must persist before work starts.
          runtime = once(runtime,
              '    ) -> Result<Value, String> {\n        self.emit_event(RuntimeEvent::TurnStart {\n            input: Value::String(user_input.to_string()),',
              '    ) -> Result<Value, String> {\n        self.clear_event_error();\n        self.emit_event(RuntimeEvent::TurnStart {\n            input: Value::String(user_input.to_string()),',
              'run clear')
          runtime = once(runtime,
              '            run_id: self.run_id.clone(),\n        });\n        let mut message = json!({"role": "user", "content": user_input, "ts": now_ts()});',
              '            run_id: self.run_id.clone(),\n        });\n        self.ensure_event_delivery()?;\n        let mut message = json!({"role": "user", "content": user_input, "ts": now_ts()});',
              'run start guard')
          runtime = once(runtime,
              '        let result = self.loop_turn();\n        if result.is_err() {',
              '        let result = self.loop_turn().and_then(|status| {\n            self.ensure_event_delivery()?;\n            Ok(status)\n        });\n        if result.is_err() {',
              'run result guard')

          runtime = once(runtime,
              '    pub fn resume(&mut self) -> Result<Value, String> {\n        self.emit_event(RuntimeEvent::TurnStart {',
              '    pub fn resume(&mut self) -> Result<Value, String> {\n        self.clear_event_error();\n        self.emit_event(RuntimeEvent::TurnStart {',
              'resume clear')
          runtime = once(runtime,
              '            run_id: self.run_id.clone(),\n        });\n        self.ledger_transition("run.started", "system", json!({"kind": "resume"}))?;',
              '            run_id: self.run_id.clone(),\n        });\n        self.ensure_event_delivery()?;\n        self.ledger_transition("run.started", "system", json!({"kind": "resume"}))?;',
              'resume start guard')
          runtime = once(runtime,
              '    pub fn retry(&mut self) -> Result<Value, String> {\n        let tail_is_error =',
              '    pub fn retry(&mut self) -> Result<Value, String> {\n        self.clear_event_error();\n        let tail_is_error =',
              'retry clear')
          runtime = once(runtime,
              '            run_id: self.run_id.clone(),\n        });\n        self.ledger_transition("run.started", "system", json!({"kind": "retry"}))?;',
              '            run_id: self.run_id.clone(),\n        });\n        self.ensure_event_delivery()?;\n        self.ledger_transition("run.started", "system", json!({"kind": "retry"}))?;',
              'retry start guard')

          # Model-switch events also report persistence failure to the command caller.
          runtime = once(runtime,
              '            RuntimeCommand::SwitchModel { change, reply } => {\n                let notice = match change {',
              '            RuntimeCommand::SwitchModel { change, reply } => {\n                host.clear_event_error();\n                let notice = match change {',
              'switch clear')
          runtime = once(runtime,
              '                sync_message_snapshot(&host, &messages);\n                let _ = reply.send(Ok(notice));',
              '                sync_message_snapshot(&host, &messages);\n                let result = host.ensure_event_delivery().map(|_| notice);\n                let _ = reply.send(result);',
              'switch result')

          # Tests and test sinks follow the fallible contract.
          runtime = once(runtime,
              '    impl EventSink for CaptureSink {\n        fn emit(&self, frame: Value) {\n            self.frames.lock().unwrap().push(frame);\n        }\n    }',
              '    impl EventSink for CaptureSink {\n        fn emit(&self, frame: Value) -> Result<(), String> {\n            self.frames.lock().unwrap().push(frame);\n            Ok(())\n        }\n    }',
              'CaptureSink')
          runtime = once(runtime,
              '            sequence: Arc::new(Mutex::new(0)),\n            sink: sink.clone(),\n        };',
              '            sequence: Arc::new(Mutex::new(0)),\n            sink: sink.clone(),\n            event_error: Arc::new(Mutex::new(None)),\n        };',
              'emitter test init')
          runtime = once(runtime,
              '    #[derive(Default)]\n    struct CaptureSink {\n        frames: Mutex<Vec<Value>>,\n    }\n\n    struct MockProvider {',
              '    #[derive(Default)]\n    struct CaptureSink {\n        frames: Mutex<Vec<Value>>,\n    }\n\n    struct FailOnTurnEndSink {\n        frames: Mutex<Vec<Value>>,\n    }\n\n    impl EventSink for FailOnTurnEndSink {\n        fn emit(&self, frame: Value) -> Result<(), String> {\n            if frame.get("type").and_then(Value::as_str) == Some("turn_end") {\n                return Err("simulated persistence failure".to_string());\n            }\n            self.frames.lock().unwrap().push(frame);\n            Ok(())\n        }\n    }\n\n    struct MockProvider {',
              'failing sink fixture')
          runtime = once(runtime,
              '    #[test]\n    fn runtime_handle_runs_in_background_and_rejects_parallel_run() {',
              '    #[test]\n    fn event_sink_failure_fails_run_and_suppresses_success_terminal_event() {\n        let sink = Arc::new(FailOnTurnEndSink { frames: Mutex::new(Vec::new()) });\n        let mut host = RuntimeHost::new(\n            "session-persistence-failure",\n            RuntimeConfig { max_iterations: 0, ..RuntimeConfig::default() },\n        )\n        .with_event_sink(sink.clone());\n\n        let result = host.run("hello", None);\n        assert!(result.as_ref().err().is_some_and(|error| error.contains("runtime event delivery failed")));\n        let frames = sink.frames.lock().unwrap();\n        let event_types = frames\n            .iter()\n            .filter_map(|frame| frame.get("type").and_then(Value::as_str))\n            .collect::<Vec<_>>();\n        assert_eq!(event_types, vec!["turn_start"]);\n    }\n\n    #[test]\n    fn runtime_handle_runs_in_background_and_rejects_parallel_run() {',
              'persistence regression test')

          # Desktop persistence and delivery are now part of the EventSink result.
          pattern = re.compile(r'''impl EventSink for TauriEventSink \{\n    fn emit\(&self, frame: Value\) \{.*?\n    \}\n\}\n''', re.S)
          replacement = '''impl EventSink for TauriEventSink {
              fn emit(&self, frame: Value) -> Result<(), String> {
                  delta_runtime_native::control_plane::record_runtime_event(&self.state_dir, &frame)
                      .map_err(|error| format!("persist runtime event: {error}"))?;
                  if frame.get("type").and_then(Value::as_str) == Some("turn_end") {
                      if let (Some(session_id), Some(status)) = (
                          frame.get("sessionId").and_then(Value::as_str),
                          frame
                              .get("payload")
                              .and_then(|payload| payload.get("status"))
                              .and_then(Value::as_str),
                      ) {
                          if session_id.starts_with("__run__") {
                              self.automations
                                  .lock()
                                  .unwrap()
                                  .finalize_session(session_id, status)
                                  .map_err(|error| format!("finalize automation session: {error}"))?;
                          }
                      }
                  }
                  self.app
                      .emit("delta-runtime-event", frame)
                      .map_err(|error| format!("emit runtime event: {error}"))?;
                  Ok(())
              }
          }
          '''
          desktop, n = pattern.subn(replacement, desktop, count=1)
          if n != 1:
              raise SystemExit(f'TauriEventSink: expected 1 target, got {n}')

          rp.write_text(runtime)
          dp.write_text(desktop)
          PY
          rustfmt --edition 2021 core/runtime-native/src/runtime.rs apps/desktop/src-tauri/src/runtime_ipc.rs
          git diff --check
      - name: Commit patch and remove staging workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_r7-runtime-persistence-patch.yml
          git rm .github/workflows/_r7-runtime-persistence-patch-v2.yml
          git add core/runtime-native/src/runtime.rs apps/desktop/src-tauri/src/runtime_ipc.rs
          git diff --cached --check
          git commit -m "fix(r7): fail closed on runtime event persistence errors"
          git push origin HEAD:codex/r7-runtime-persistence-failclosed
