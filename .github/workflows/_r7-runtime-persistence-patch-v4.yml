name: R7 Runtime Persistence Patch v4

on:
  push:
    branches:
      - codex/r7-runtime-persistence-failclosed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/r7-runtime-persistence-failclosed
      - name: Reuse verified structural patch with safe test insertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/_r7-runtime-persistence-patch-v3.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          old = "'''    #[test]\n    fn event_sink_failure_fails_run_and_suppresses_later_terminal_events()"
          new = "r'''    #[test]\n    fn event_sink_failure_fails_run_and_suppresses_later_terminal_events()"
          if script.count(old) != 1:
              raise SystemExit(f'expected one unsafe test replacement, got {script.count(old)}')
          script = script.replace(old, new, 1)

          exec(compile(script, '<r7-runtime-persistence-patch-v4>', 'exec'))
          PY
          rustfmt --edition 2021 core/runtime-native/src/runtime.rs apps/desktop/src-tauri/src/runtime_ipc.rs
          git diff --check
      - name: Verify Rust core
        shell: bash
        run: |
          cargo check --manifest-path core/runtime-native/Cargo.toml
          cargo test --manifest-path core/runtime-native/Cargo.toml
      - name: Commit product patch and remove staging workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_r7-runtime-persistence-patch.yml
          git rm .github/workflows/_r7-runtime-persistence-patch-v2.yml
          git rm .github/workflows/_r7-runtime-persistence-patch-v3.yml
          git rm .github/workflows/_r7-runtime-persistence-patch-v4.yml
          git add core/runtime-native/src/runtime.rs apps/desktop/src-tauri/src/runtime_ipc.rs
          git diff --cached --check
          git commit -m "fix(r7): fail closed on runtime event persistence errors"
          git push origin HEAD:codex/r7-runtime-persistence-failclosed
