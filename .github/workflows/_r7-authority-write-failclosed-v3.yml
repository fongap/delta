name: R7 Authority Write Fail-Closed v3

on:
  push:
    branches:
      - codex/r7-authority-write-failclosed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/r7-authority-write-failclosed

      - name: Apply authority hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/_r7-authority-write-failclosed.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<r7-authority-write-failclosed-v3>', 'exec'))

          path = Path('core/runtime-native/src/runtime.rs')
          text = path.read_text()

          helper_start = text.index('fn mark_tool_failed(')
          helper_start = text.rfind('\n', 0, helper_start) + 1
          helper_end = text.index('fn finish_run_ledger', helper_start)
          helper_end = text.rfind('\n', 0, helper_end) + 1
          helper = '''    fn mark_tool_failed(
              &self,
              authorities: &RuntimeAuthorities,
              run_id: &str,
              call: &ToolCall,
              failure_reason: &str,
              event: (&str, &str, Value),
          ) -> Result<(), String> {
              let (event_type, actor, payload) = event;
              {
                  let writer = authorities.idempotency.lock().unwrap();
                  writer
                      .mark_failed(run_id, &call.id, failure_reason)
                      .map_err(|error| format!("failed to persist failed side-effect state: {error}"))?;
              }
              self.ledger_append(event_type, actor, payload)
                  .map_err(|error| format!("failed to persist {event_type}: {error}"))
          }

          '''
          text = text[:helper_start] + helper + text[helper_end:]

          call_pattern = re.compile(
              r'''self\.mark_tool_failed\(\s*'''
              r'''authorities,\s*'''
              r'''&run_id,\s*'''
              r'''call,\s*'''
              r'''&error,\s*'''
              r'''event_type,\s*'''
              r'''"runtime",\s*'''
              r'''payload,\s*'''
              r'''\)''',
              re.S,
          )
          call_replacement = '''self.mark_tool_failed(
                          authorities,
                          &run_id,
                          call,
                          &error,
                          (event_type, "runtime", payload),
                      )'''
          text, count = call_pattern.subn(call_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'mark_tool_failed call: expected one match, got {count}')

          path.write_text(text)
          PY

          rustfmt --edition 2021 core/runtime-native/src/runtime.rs core/runtime-native/src/tool_lifecycle.rs
          git diff --check

      - name: Verify Rust authority gates
        shell: bash
        run: |
          cargo check --manifest-path core/runtime-native/Cargo.toml
          cargo test --manifest-path core/runtime-native/Cargo.toml
          cargo clippy --manifest-path core/runtime-native/Cargo.toml --all-targets -- -D warnings

      - name: Commit product patch and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_r7-authority-write-failclosed.yml
          git rm .github/workflows/_r7-authority-write-failclosed-v2.yml
          git rm .github/workflows/_r7-authority-write-failclosed-v3.yml
          git add core/runtime-native/src/runtime.rs core/runtime-native/src/tool_lifecycle.rs
          git diff --cached --check
          git commit -m "fix(r7): fail closed on authority write failures"
          git push origin HEAD:codex/r7-authority-write-failclosed
