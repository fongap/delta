name: R7 Authority Write Fail-Closed

on:
  push:
    branches:
      - codex/r7-authority-write-failclosed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/r7-authority-write-failclosed

      - name: Harden authoritative write failures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('core/runtime-native/src/runtime.rs')
          lifecycle_path = Path('core/runtime-native/src/tool_lifecycle.rs')
          runtime = runtime_path.read_text()
          lifecycle = lifecycle_path.read_text()

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_at = text.find(start)
              if start_at < 0:
                  raise SystemExit(f'{label}: start marker not found')
              end_at = text.find(end, start_at)
              if end_at < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:start_at] + replacement + text[end_at:]

          helper_marker = '    fn finish_run_ledger(&self, result: &Result<String, String>) -> Result<(), String> {'
          helper_insert = '''    fn failure_after_ledger_event(
              &self,
              call: &ToolCall,
              event_type: &str,
              actor: &str,
              payload: Value,
              primary_error: impl Into<String>,
          ) -> ToolResult {
              let primary_error = primary_error.into();
              match self.ledger_append(event_type, actor, payload) {
                  Ok(()) => ToolResult::failure(&call.id, primary_error),
                  Err(error) => ToolResult::failure(
                      &call.id,
                      format!("{primary_error}; failed to persist {event_type}: {error}"),
                  ),
              }
          }

              fn mark_tool_uncertain(
              &self,
              authorities: &RuntimeAuthorities,
              run_id: &str,
              call: &ToolCall,
              event_type: &str,
              actor: &str,
              payload: Value,
          ) -> Result<(), String> {
              {
                  let writer = authorities.idempotency.lock().unwrap();
                  writer
                      .mark_uncertain(run_id, &call.id)
                      .map_err(|error| format!("failed to persist uncertain side-effect state: {error}"))?;
              }
              self.ledger_append(event_type, actor, payload)
                  .map_err(|error| format!("failed to persist {event_type}: {error}"))
          }

              fn mark_tool_failed(
              &self,
              authorities: &RuntimeAuthorities,
              run_id: &str,
              call: &ToolCall,
              failure_reason: &str,
              event_type: &str,
              actor: &str,
              payload: Value,
          ) -> Result<(), String> {
              {
                  let writer = authorities.idempotency.lock().unwrap();
                  writer
                      .mark_failed(run_id, &call.id, failure_reason)
                      .map_err(|error| format!("failed to persist failed side-effect state: {error}"))?;
              }
              self.ledger_append(event_type, actor, payload)
                  .map_err(|error| format!("failed to persist {event_type}: {error}"))
          }

          '''
          if helper_insert.strip() in runtime:
              raise SystemExit('authority helpers already present')
          marker_at = runtime.find(helper_marker)
          if marker_at < 0:
              raise SystemExit('finish_run_ledger marker not found')
          runtime = runtime[:marker_at] + helper_insert + runtime[marker_at:]

          execute_interaction = '''    fn execute_interaction(&self, call: &ToolCall) -> Option<ToolResult> {
              let kind = match call.name.as_str() {
                  "request_directory" => "directory",
                  "ask_user" => "question",
                  "propose_plan" => "plan",
                  _ => return None,
              };
              let receiver = match self.interactions.begin(&call.id, kind) {
                  Ok(receiver) => receiver,
                  Err(error) => return Some(ToolResult::failure(&call.id, error)),
              };
              match kind {
                  "directory" => self.emit_event(RuntimeEvent::DirectoryRequested {
                      tool_call_id: call.id.clone(),
                      reason: call
                          .arguments
                          .get("reason")
                          .and_then(Value::as_str)
                          .unwrap_or_default()
                          .to_string(),
                      path: call
                          .arguments
                          .get("path")
                          .and_then(Value::as_str)
                          .unwrap_or_default()
                          .to_string(),
                      writable: call
                          .arguments
                          .get("writable")
                          .and_then(Value::as_bool)
                          .unwrap_or(false),
                  }),
                  "question" => self.emit_event(RuntimeEvent::QuestionRequested {
                      tool_call_id: call.id.clone(),
                      arguments: call.arguments.clone(),
                  }),
                  "plan" => self.emit_event(RuntimeEvent::PlanProposed {
                      tool_call_id: call.id.clone(),
                      plan: call
                          .arguments
                          .get("plan")
                          .and_then(Value::as_str)
                          .unwrap_or_default()
                          .to_string(),
                  }),
                  _ => unreachable!(),
              }
              if let Err(error) = self.ensure_event_delivery() {
                  self.interactions.cancel(&call.id);
                  return Some(ToolResult::failure(&call.id, error));
              }
              let inbox_id = if self.config.unattended {
                  let Some(authorities) = self.authorities.as_ref() else {
                      self.interactions.cancel(&call.id);
                      return Some(ToolResult::failure(
                          &call.id,
                          "inbox authority is unavailable",
                      ));
                  };
                  match authorities.inbox.add_interaction(
                      &self.session_id,
                      &call.id,
                      kind,
                      &call.arguments,
                  ) {
                      Ok(item) => Some(item.id),
                      Err(error) => {
                          self.interactions.cancel(&call.id);
                          return Some(ToolResult::failure(
                              &call.id,
                              format!("failed to persist inbox interaction: {error}"),
                          ));
                      }
                  }
              } else {
                  None
              };
              if let Err(error) = self.register_checkpoint(
                  "awaiting_user",
                  Some(json!({"id": call.id, "name": call.name, "arguments": call.arguments})),
                  inbox_id,
                  Vec::new(),
                  None,
              ) {
                  self.interactions.cancel(&call.id);
                  return Some(ToolResult::failure(&call.id, error));
              }
              self.set_runtime_state(RuntimeState::WaitingUser);
              loop {
                  if self.cancel.load(Ordering::Acquire) {
                      self.interactions.cancel(&call.id);
                      let primary = "run cancelled while user input was pending";
                      if let Err(error) = self.ledger_append(
                          "interaction.cancelled",
                          "user",
                          json!({"tool_call_id": call.id, "kind": kind}),
                      ) {
                          return Some(ToolResult::failure(
                              &call.id,
                              format!("{primary}; failed to persist interaction.cancelled: {error}"),
                          ));
                      }
                      return Some(ToolResult::failure(&call.id, primary));
                  }
                  match receiver.recv_timeout(Duration::from_millis(25)) {
                      Ok(value) => {
                          self.set_runtime_state(RuntimeState::Running);
                          if let Err(error) = self.ledger_append(
                              "interaction.resolved",
                              "user",
                              json!({"tool_call_id": call.id, "kind": kind, "response": value.clone()}),
                          ) {
                              return Some(ToolResult::failure(
                                  &call.id,
                                  format!("failed to persist interaction.resolved: {error}"),
                              ));
                          }
                          return Some(ToolResult::success(&call.id, value));
                      }
                      Err(mpsc::RecvTimeoutError::Timeout) => {}
                      Err(mpsc::RecvTimeoutError::Disconnected) => {
                          return Some(ToolResult::failure(
                              &call.id,
                              "user interaction was abandoned",
                          ));
                      }
                  }
              }
          }

          '''
          runtime = replace_between(
              runtime,
              '    fn execute_interaction(&self, call: &ToolCall) -> Option<ToolResult> {',
              '    fn execute_tool_call(&self, call: &ToolCall) -> ToolResult {',
              execute_interaction,
              'execute_interaction',
          )

          execute_tool_call = '''    fn execute_tool_call(&self, call: &ToolCall) -> ToolResult {
              let (_schema, metadata) = match self.tool_contract(call) {
                  Ok(contract) => contract,
                  Err(error) => {
                      return self.failure_after_ledger_event(
                          call,
                          "tool.failed",
                          "runtime",
                          json!({"tool_call_id": call.id, "tool": call.name, "stage": "schema", "error": &error}),
                          error,
                      );
                  }
              };
              let (level, decision) = match self.policy_for(call, metadata) {
                  Ok(outcome) => outcome,
                  Err(error) => return ToolResult::failure(&call.id, error),
              };
              self.emit_event(RuntimeEvent::ToolProposed {
                  tool_call_id: call.id.clone(),
                  name: call.name.clone(),
                  arguments: call.arguments.clone(),
                  risk_level: Some(format!("{level:?}")),
              });
              if let Err(error) = self.ensure_event_delivery() {
                  return ToolResult::failure(&call.id, error);
              }
              if let Err(error) = self.ledger_append(
                  "tool.proposed",
                  "model",
                  json!({"tool_call_id": call.id, "tool": call.name, "arguments": call.arguments, "level": format!("{level:?}")}),
              ) {
                  return ToolResult::failure(&call.id, error);
              }

              if !decision.allowed
                  && self
                      .approvals
                      .has_standing_grant(&call.name, &call.arguments)
              {
                  if let Err(error) = self.record_approval(
                      call,
                      "standing_policy_resolved",
                      "auto_approved",
                      Some("standing"),
                      "approved by a session-scoped standing grant",
                      level,
                  ) {
                      return ToolResult::failure(&call.id, error);
                  }
              } else if !decision.allowed {
                  if !decision.needs_user {
                      if let Err(error) = self.record_approval(
                          call,
                          "policy_denied",
                          "denied",
                          None,
                          &decision.reason,
                          level,
                      ) {
                          return ToolResult::failure(
                              &call.id,
                              format!(
                                  "{}; failed to persist policy denial: {error}",
                                  decision.reason
                              ),
                          );
                      }
                      return self.failure_after_ledger_event(
                          call,
                          "tool.failed",
                          "runtime",
                          json!({"tool_call_id": call.id, "tool": call.name, "stage": "policy", "error": &decision.reason}),
                          decision.reason,
                      );
                  }
                  match self.require_approval(call, &decision.reason, level) {
                      Ok(approval) if approval.is_approved() => {}
                      Ok(_) => {
                          return self.failure_after_ledger_event(
                              call,
                              "tool.cancelled",
                              "user",
                              json!({"tool_call_id": call.id, "tool": call.name, "reason": "denied"}),
                              "tool call denied by user",
                          );
                      }
                      Err(error) => {
                          return self.failure_after_ledger_event(
                              call,
                              "tool.cancelled",
                              "runtime",
                              json!({"tool_call_id": call.id, "tool": call.name, "reason": &error}),
                              error,
                          );
                      }
                  }
              } else if let Err(error) = self.record_approval(
                  call,
                  "policy_resolved",
                  "auto_approved",
                  Some("policy"),
                  &decision.reason,
                  level,
              ) {
                  return ToolResult::failure(&call.id, error);
              }
              if let Err(error) = self.ledger_append(
                  "tool.approved",
                  "runtime",
                  json!({"tool_call_id": call.id, "tool": call.name, "level": format!("{level:?}")}),
              ) {
                  return ToolResult::failure(&call.id, error);
              }

              if let Some(result) = self.execute_interaction(call) {
                  return result;
              }

              let Some(authorities) = &self.authorities else {
                  return ToolResult::failure(&call.id, "runtime authorities are unavailable");
              };
              let run_id = self.run_id.clone().unwrap_or_else(uuid_v4);
              let plan_input = ToolLifecyclePlanInput {
                  db: "side_effects.db".to_string(),
                  run_id: run_id.clone(),
                  tool_call_id: call.id.clone(),
                  tool_name: call.name.clone(),
                  args: call.arguments.clone(),
              };
              let plan = match tool_lifecycle::plan(&authorities.idempotency.lock().unwrap(), &plan_input)
              {
                  Ok(plan) => plan,
                  Err(error) => return ToolResult::failure(&call.id, error.to_string()),
              };
              match plan.action {
                  PlanAction::Replay => {
                      let output = plan.result.unwrap_or_else(|| json!({"ok": true}));
                      if let Err(error) = self.ledger_append(
                          "tool.replayed",
                          "runtime",
                          json!({"tool_call_id": call.id, "tool": call.name}),
                      ) {
                          return ToolResult::failure(
                              &call.id,
                              format!("committed result exists but tool.replayed could not be persisted: {error}"),
                          );
                      }
                      return ToolResult::success(&call.id, output);
                  }
                  PlanAction::Uncertain => {
                      let uncertainty = plan
                          .error
                          .as_ref()
                          .and_then(|value| value.get("error"))
                          .and_then(Value::as_str)
                          .unwrap_or("previous tool result is uncertain")
                          .to_string();
                      if let Err(error) = self.ledger_append(
                          "tool.uncertain",
                          "runtime",
                          json!({"tool_call_id": call.id, "tool": call.name, "operation_id": plan.operation_id}),
                      ) {
                          return ToolResult::failure(
                              &call.id,
                              format!("{uncertainty}; failed to persist tool.uncertain: {error}"),
                          );
                      }
                      return ToolResult::failure(&call.id, uncertainty);
                  }
                  PlanAction::Execute => {}
              }

              self.emit_event(RuntimeEvent::ToolStarted {
                  tool_call_id: call.id.clone(),
                  name: call.name.clone(),
              });
              if let Err(error) = self.ensure_event_delivery() {
                  return ToolResult::failure(&call.id, error);
              }
              if let Err(error) = self.ledger_append(
                  "tool.started",
                  "runtime",
                  json!({"tool_call_id": call.id, "tool": call.name}),
              ) {
                  return ToolResult::failure(&call.id, error);
              }

              let progress_error = Arc::new(Mutex::new(None::<String>));
              let progress_error_sink = progress_error.clone();
              let progress_authorities = authorities.clone();
              let progress_run_id = run_id.clone();
              let progress_workspace = self.config.workspace.clone().unwrap_or_default();
              let progress_tool_call_id = call.id.clone();
              let progress_tool = call.name.clone();
              let progress = Arc::new(move |frame: CapabilityProgress| {
                  let write_result = progress_authorities.ledger.lock().unwrap().append(
                      &progress_run_id,
                      "tool.progress",
                      "worker",
                      now_ts(),
                      &json!({
                          "tool_call_id": progress_tool_call_id,
                          "tool": progress_tool,
                          "job_id": frame.job_id,
                          "fraction": frame.fraction,
                          "stage": frame.stage,
                          "message": frame.message,
                      }),
                      &progress_workspace,
                  );
                  if let Err(error) = write_result {
                      let mut current = progress_error_sink.lock().unwrap();
                      if current.is_none() {
                          *current = Some(error.to_string());
                      }
                  }
              });
              let context = ToolExecutionContext {
                  session_id: self.session_id.clone(),
                  run_id: run_id.clone(),
                  workspace: self.config.workspace.clone(),
                  timeout: Duration::from_secs_f64(self.config.tool_timeout.unwrap_or(120.0).max(0.1)),
                  cancel: self.cancel.clone(),
                  progress,
              };
              let mut result = self.tool_executor.execute(call, &context);

              if let Some(progress_error) = progress_error.lock().unwrap().clone() {
                  let primary = format!(
                      "tool progress ledger persistence failed after execution started; outcome is uncertain: {progress_error}"
                  );
                  if let Err(error) = self.mark_tool_uncertain(
                      authorities,
                      &run_id,
                      call,
                      "tool.uncertain",
                      "runtime",
                      json!({
                          "tool_call_id": call.id,
                          "tool": call.name,
                          "reason": "progress_persistence_failed",
                          "error": &progress_error
                      }),
                  ) {
                      return ToolResult::failure(&call.id, format!("{primary}; {error}"));
                  }
                  return ToolResult::failure(&call.id, primary);
              }

              if self.cancel.load(Ordering::Acquire) {
                  let primary = "tool cancelled; side effect is uncertain";
                  if let Err(error) = self.mark_tool_uncertain(
                      authorities,
                      &run_id,
                      call,
                      "tool.cancelled",
                      "user",
                      json!({"tool_call_id": call.id, "tool": call.name, "state": "uncertain"}),
                  ) {
                      return ToolResult::failure(&call.id, format!("{primary}; {error}"));
                  }
                  return ToolResult::failure(&call.id, primary);
              }

              if let Some(error) = result.error.clone() {
                  let event_type = match result.state {
                      ToolExitState::TimedOut => "tool.timed_out",
                      ToolExitState::Cancelled => "tool.cancelled",
                      ToolExitState::Completed | ToolExitState::Failed => "tool.failed",
                  };
                  let payload = json!({
                      "tool_call_id": call.id,
                      "tool": call.name,
                      "error": &error,
                      "state": format!("{:?}", result.state).to_lowercase()
                  });
                  let persisted = if matches!(
                      result.state,
                      ToolExitState::TimedOut | ToolExitState::Cancelled
                  ) {
                      self.mark_tool_uncertain(
                          authorities,
                          &run_id,
                          call,
                          event_type,
                          "runtime",
                          payload,
                      )
                  } else {
                      self.mark_tool_failed(
                          authorities,
                          &run_id,
                          call,
                          &error,
                          event_type,
                          "runtime",
                          payload,
                      )
                  };
                  if let Err(persistence_error) = persisted {
                      return ToolResult::failure(
                          &call.id,
                          format!("{error}; {persistence_error}"),
                      );
                  }
                  return result;
              }

              let artifacts = match self.formalize_artifacts(&result.staged_artifacts) {
                  Ok(artifacts) => artifacts,
                  Err(error) => {
                      let primary = format!(
                          "{error}; capability execution completed but artifact finalization did not reach a trusted terminal state"
                      );
                      if let Err(persistence_error) = self.mark_tool_uncertain(
                          authorities,
                          &run_id,
                          call,
                          "tool.uncertain",
                          "runtime",
                          json!({"tool_call_id": call.id, "tool": call.name, "stage": "artifact", "error": &error}),
                      ) {
                          return ToolResult::failure(
                              &call.id,
                              format!("{primary}; {persistence_error}"),
                          );
                      }
                      return ToolResult::failure(&call.id, primary);
                  }
              };
              let validation = match self
                  .validate_tool_artifacts(&artifacts, result.validation_criteria.as_ref())
              {
                  Ok(validation) if validation.get("ok").and_then(Value::as_bool) != Some(false) => {
                      validation
                  }
                  Ok(validation) => {
                      let error = "tool artifact validation failed".to_string();
                      let primary = format!(
                          "{error}; capability execution completed but validation did not reach a trusted terminal state"
                      );
                      if let Err(persistence_error) = self.mark_tool_uncertain(
                          authorities,
                          &run_id,
                          call,
                          "tool.uncertain",
                          "runtime",
                          json!({"tool_call_id": call.id, "tool": call.name, "stage": "validation", "error": &error, "validation": validation}),
                      ) {
                          return ToolResult::failure(
                              &call.id,
                              format!("{primary}; {persistence_error}"),
                          );
                      }
                      return ToolResult::failure(&call.id, primary);
                  }
                  Err(error) => {
                      let primary = format!(
                          "{error}; capability execution completed but validation persistence did not reach a trusted terminal state"
                      );
                      if let Err(persistence_error) = self.mark_tool_uncertain(
                          authorities,
                          &run_id,
                          call,
                          "tool.uncertain",
                          "runtime",
                          json!({"tool_call_id": call.id, "tool": call.name, "stage": "validation", "error": &error}),
                      ) {
                          return ToolResult::failure(
                              &call.id,
                              format!("{primary}; {persistence_error}"),
                          );
                      }
                      return ToolResult::failure(&call.id, primary);
                  }
              };
              if let Some(output) = result.output.as_object_mut() {
                  if !artifacts.is_empty() {
                      output.insert("artifacts".to_string(), Value::Array(artifacts.clone()));
                  }
                  output.insert("validation".to_string(), validation);
              }
              if let Err(error) = authorities.idempotency.lock().unwrap().commit(
                  &run_id,
                  &call.id,
                  &call.name,
                  &call.arguments,
                  &result.output,
              ) {
                  let primary = format!(
                      "tool result commit failed after capability execution; outcome is uncertain: {error}"
                  );
                  if let Err(persistence_error) = self.mark_tool_uncertain(
                      authorities,
                      &run_id,
                      call,
                      "tool.uncertain",
                      "runtime",
                      json!({"tool_call_id": call.id, "tool": call.name, "reason": "idempotency_commit_failed", "error": error.to_string()}),
                  ) {
                      return ToolResult::failure(
                          &call.id,
                          format!("{primary}; {persistence_error}"),
                      );
                  }
                  return ToolResult::failure(&call.id, primary);
              }
              if let Err(error) = self.ledger_append(
                  "tool.completed",
                  "runtime",
                  json!({"tool_call_id": call.id, "tool": call.name, "result": result.output}),
              ) {
                  return ToolResult::failure(&call.id, error);
              }
              if let Err(error) = self.register_checkpoint("tool_completed", None, None, artifacts, None)
              {
                  return ToolResult::failure(&call.id, error);
              }
              result
          }

          '''
          runtime = replace_between(
              runtime,
              '    fn execute_tool_call(&self, call: &ToolCall) -> ToolResult {',
              '    fn loop_turn(&mut self) -> Result<String, String> {',
              execute_tool_call,
              'execute_tool_call',
          )

          # Regression fixtures for post-execution failures.
          fixture_marker = '    fn tool_contract(risk: &str, requires_approval: bool) -> Value {'
          fixture_insert = '''    struct ProgressLedgerFailureExecutor {
              ledger_db: PathBuf,
              calls: Arc<AtomicUsize>,
          }

              impl ToolExecutor for ProgressLedgerFailureExecutor {
              fn execute(&self, call: &ToolCall, context: &ToolExecutionContext) -> ToolResult {
                  self.calls.fetch_add(1, Ordering::SeqCst);
                  let connection = rusqlite::Connection::open(&self.ledger_db).unwrap();
                  connection.execute_batch("DROP TABLE run_events").unwrap();
                  (context.progress)(CapabilityProgress {
                      job_id: "job-progress-failure".to_string(),
                      fraction: 0.5,
                      stage: Some("working".to_string()),
                      message: Some("halfway".to_string()),
                  });
                  ToolResult::success(&call.id, json!({"ok": true}))
              }
          }

          '''
          fixture_at = runtime.find(fixture_marker)
          if fixture_at < 0:
              raise SystemExit('runtime test fixture marker not found')
          runtime = runtime[:fixture_at] + fixture_insert + runtime[fixture_at:]

          test_marker = '    #[test]\n    fn approval_authority_blocks_execution_until_ipc_resolution() {'
          test_insert = '''    #[test]
              fn post_execution_artifact_failure_becomes_uncertain_and_never_reexecutes() {
              let temp = tempfile::tempdir().unwrap();
              let workspace = temp.path().join("workspace");
              let staging = workspace.join(".delta/staging/run-postprocess");
              fs::create_dir_all(&staging).unwrap();
              let escaped = workspace.join("escaped.md");
              fs::write(&escaped, "candidate").unwrap();
              let authorities = RuntimeAuthorities::open(temp.path().join("state")).unwrap();
              let calls = Arc::new(AtomicUsize::new(0));
              let mut host = RuntimeHost::new(
                  "session-postprocess",
                  RuntimeConfig {
                      workspace: Some(workspace.to_string_lossy().to_string()),
                      ..RuntimeConfig::default()
                  },
              )
              .with_authorities(authorities.clone())
              .with_tools(tool_contract("low", false))
              .with_tool_executor(Arc::new(CountingExecutor {
                  calls: calls.clone(),
                  staged: Some(StagedArtifact {
                      staging_path: escaped,
                      relative_path: "reports/final.md".to_string(),
                      kind: "markdown".to_string(),
                      incomplete: false,
                  }),
              }));
              host.set_run_id("run-postprocess".to_string());
              let call = ToolCall {
                  id: "call-postprocess".to_string(),
                  name: "write_report".to_string(),
                  arguments: json!({"path": "reports/final.md"}),
              };

              let first = host.execute_tool_call(&call);
              assert!(first.error.is_some());
              assert_eq!(calls.load(Ordering::SeqCst), 1);
              let entry = authorities
                  .idempotency
                  .lock()
                  .unwrap()
                  .get("run-postprocess", "call-postprocess")
                  .unwrap()
                  .unwrap();
              assert_eq!(entry.state, crate::idemlog::SideEffectState::Uncertain);

              let second = host.execute_tool_call(&call);
              assert!(second
                  .error
                  .as_deref()
                  .is_some_and(|error| error.contains("uncertain")));
              assert_eq!(calls.load(Ordering::SeqCst), 1);
          }

              #[test]
              fn progress_ledger_failure_marks_side_effect_uncertain() {
              let temp = tempfile::tempdir().unwrap();
              let authorities = RuntimeAuthorities::open(temp.path()).unwrap();
              let calls = Arc::new(AtomicUsize::new(0));
              let mut host = RuntimeHost::new("session-progress-failure", RuntimeConfig::default())
                  .with_authorities(authorities.clone())
                  .with_tools(tool_contract("low", false))
                  .with_tool_executor(Arc::new(ProgressLedgerFailureExecutor {
                      ledger_db: temp.path().join("run_events.db"),
                      calls: calls.clone(),
                  }));
              host.set_run_id("run-progress-failure".to_string());

              let result = host.execute_tool_call(&ToolCall {
                  id: "call-progress-failure".to_string(),
                  name: "write_report".to_string(),
                  arguments: json!({"path": "report.md"}),
              });
              assert!(result.error.as_deref().is_some_and(|error| {
                  error.contains("tool progress ledger persistence failed")
              }));
              assert_eq!(calls.load(Ordering::SeqCst), 1);
              let entry = authorities
                  .idempotency
                  .lock()
                  .unwrap()
                  .get("run-progress-failure", "call-progress-failure")
                  .unwrap()
                  .unwrap();
              assert_eq!(entry.state, crate::idemlog::SideEffectState::Uncertain);
          }

          '''
          test_at = runtime.find(test_marker)
          if test_at < 0:
              raise SystemExit('runtime regression insertion marker not found')
          runtime = runtime[:test_at] + test_insert + runtime[test_at:]

          plan_replacement = '''pub fn plan(
              writer: &IdempotencyWriter,
              input: &ToolLifecyclePlanInput,
          ) -> Result<ToolLifecyclePlanOutput, ShadowReadError> {
              if input.run_id.is_empty() || input.tool_call_id.is_empty() {
                  return Ok(ToolLifecyclePlanOutput {
                      action: PlanAction::Execute,
                      result: None,
                      error: None,
                      operation_id: None,
                  });
              }

              if let Some(entry) = writer.get(&input.run_id, &input.tool_call_id)? {
                  let incoming_sha = crate::idemlog::args_sha256(&input.args);
                  if entry.args_sha256 != incoming_sha {
                      return Err(ShadowReadError::Parse(format!(
                          "identity_collision: operation_id {} already has args_sha256 {} but new args produce {}",
                          entry.operation_id, entry.args_sha256, incoming_sha
                      )));
                  }
                  match entry.state {
                      crate::idemlog::SideEffectState::Uncertain => {
                          return Ok(ToolLifecyclePlanOutput {
                              action: PlanAction::Uncertain,
                              result: None,
                              error: Some(serde_json::json!({
                                  "error": "side effect is uncertain — the previous run may or may not have executed it. User resolution required.",
                                  "operation_id": entry.operation_id.clone(),
                              })),
                              operation_id: Some(entry.operation_id),
                          });
                      }
                      crate::idemlog::SideEffectState::Committed => {
                          return Ok(ToolLifecyclePlanOutput {
                              action: PlanAction::Replay,
                              result: Some(entry.result),
                              error: None,
                              operation_id: None,
                          });
                      }
                      crate::idemlog::SideEffectState::Executing => {
                          writer.mark_uncertain(&input.run_id, &input.tool_call_id)?;
                          return Ok(ToolLifecyclePlanOutput {
                              action: PlanAction::Uncertain,
                              result: None,
                              error: Some(serde_json::json!({
                                  "error": "side effect is uncertain — a previous execution started but did not reach a durable terminal state. User resolution required.",
                                  "operation_id": entry.operation_id.clone(),
                              })),
                              operation_id: Some(entry.operation_id),
                          });
                      }
                      crate::idemlog::SideEffectState::Planned => {
                          writer.mark_executing(&input.run_id, &input.tool_call_id)?;
                          return Ok(ToolLifecyclePlanOutput {
                              action: PlanAction::Execute,
                              result: None,
                              error: None,
                              operation_id: None,
                          });
                      }
                      crate::idemlog::SideEffectState::Failed => {}
                  }
              }

              writer.record_planned(
                  &input.run_id,
                  &input.tool_call_id,
                  &input.tool_name,
                  &input.args,
              )?;
              writer.mark_executing(&input.run_id, &input.tool_call_id)?;
              Ok(ToolLifecyclePlanOutput {
                  action: PlanAction::Execute,
                  result: None,
                  error: None,
                  operation_id: None,
              })
          }

          '''
          lifecycle = replace_between(
              lifecycle,
              'pub fn plan(\n',
              '/// Input for an interruption lifecycle decision',
              plan_replacement,
              'tool_lifecycle::plan',
          )

          lifecycle_test_marker = '    #[test]\n    fn args_sha256_mismatch_is_not_replay() {'
          lifecycle_test = '''    #[test]
              fn executing_entry_becomes_uncertain_instead_of_reexecuting() {
              let dir = tempdir().unwrap();
              let db = dir.path().join("side_effects.db");
              let writer = IdempotencyWriter::open(&db).unwrap();
              let args = serde_json::json!({"path": "a.txt"});
              writer
                  .record_planned("r-executing", "c-executing", "write_file", &args)
                  .unwrap();
              writer
                  .mark_executing("r-executing", "c-executing")
                  .unwrap();

              let out = plan(
                  &writer,
                  &input(
                      db.to_str().unwrap(),
                      "r-executing",
                      "c-executing",
                      "write_file",
                      args,
                  ),
              )
              .unwrap();
              assert!(matches!(out.action, PlanAction::Uncertain));
              let entry = writer
                  .get("r-executing", "c-executing")
                  .unwrap()
                  .unwrap();
              assert_eq!(entry.state, crate::idemlog::SideEffectState::Uncertain);
          }

          '''
