[package]
name = "delta-desktop"
version = "0.4.0-dev.0"
description = "Delta desktop shell"
edition = "2021"
rust-version = "1.85"

[lib]
name = "delta_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
# R6: the Rust Runtime is now embedded directly — no Python sidecar.
# Localhost auth proxy (proxy.rs): kept for browser-dev backward compat (no-token HTTP).
tokio = { version = "1", features = ["net", "io-util", "rt"] }
# R6: in-process Runtime Host — replaces the delta-server subprocess.
delta-runtime-native = { path = "../../../core/runtime-native" }
# Kept outside the Tauri shell so another product can depend on the same local STT engine.
delta-stt = { path = "../../../services/stt" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
